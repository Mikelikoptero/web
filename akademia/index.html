<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akademia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #f2ecdf;
      --fondo-tarjeta: #faf6ee;
      --texto: #3a352d;
      --texto-suave: #7a7264;
      --borde: #ddd3c0;
      --acento: #8a7a5c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--fondo);
      color: var(--texto);
      font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 820px;
      padding: 64px 24px 24px;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 2.6rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .volver {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--texto-suave);
      text-decoration: none;
      border-bottom: 1px solid var(--borde);
      padding-bottom: 1px;
    }

    .volver:hover {
      color: var(--acento);
      border-bottom-color: var(--acento);
    }

    main {
      width: 100%;
      max-width: 820px;
      padding: 0 24px 64px;
    }

    .seccion-titulo {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--texto-suave);
      margin-bottom: 16px;
      border-bottom: 1px solid var(--borde);
      padding-bottom: 8px;
    }

    .shortcuts {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .shortcut {
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s ease;
      gap: 8px;
    }

    .shortcut:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .shortcut svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Tabla de horario */
    .horario-container {
      overflow-x: auto;
      margin-bottom: 24px;
    }

    .horario {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .horario th,
    .horario td {
      border: 1px solid var(--borde);
      padding: 2px;
      text-align: center;
      min-width: 80px;
      vertical-align: top;
    }

    .horario th {
      background-color: var(--fondo-tarjeta);
      font-weight: 600;
      color: var(--texto-suave);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 6px 4px;
    }

    .horario .hora {
      background-color: var(--fondo-tarjeta);
      font-weight: 500;
      color: var(--texto-suave);
      font-size: 0.75rem;
      min-width: 45px;
      vertical-align: middle;
      padding: 4px 6px;
    }

    .horario td .celda {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 2px;
    }

    .horario td .celda input {
      width: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-family: inherit;
      font-size: 0.7rem;
      color: var(--texto);
      outline: none;
      padding: 2px 2px;
      min-height: 18px;
      border-radius: 2px;
      transition: background-color 0.15s ease;
    }

    .horario td .celda input:focus {
      background-color: rgba(138, 122, 92, 0.12);
    }

    .horario td .celda input::placeholder {
      color: var(--texto-suave);
      opacity: 0.3;
      font-size: 0.6rem;
    }

    /* Colores pastel para cada celda */
    .horario td .celda.fila-0 { background-color: #fde8e8; }
    .horario td .celda.fila-1 { background-color: #fde8f0; }
    .horario td .celda.fila-2 { background-color: #f0e8fd; }
    .horario td .celda.fila-3 { background-color: #e8f0fd; }
    .horario td .celda.fila-4 { background-color: #e8fde8; }

    /* Botones de respaldo */
    .respaldo {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .respaldo button {
      padding: 8px 16px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .respaldo button:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .respaldo input[type="file"] {
      display: none;
    }

    footer {
      margin-top: auto;
      padding: 24px;
      font-size: 0.8rem;
      color: var(--texto-suave);
    }

    @media (max-width: 640px) {
      .horario {
        font-size: 0.65rem;
      }

      .horario th,
      .horario td {
        padding: 1px;
        min-width: 50px;
      }

      .horario td .celda input {
        font-size: 0.6rem;
        min-height: 14px;
        padding: 1px;
      }

      .horario .hora {
        min-width: 30px;
        font-size: 0.6rem;
        padding: 2px 4px;
      }

      .horario th {
        font-size: 0.6rem;
        padding: 4px 2px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Akademia</h1>
    <a class="volver" href="../">Volver al inicio</a>
  </header>

  <main>
    <p class="seccion-titulo">Recursos</p>

    <div class="shortcuts">
      <a class="shortcut" href="https://www.desmos.com/calculator?lang=es" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        Desmos
      </a>
      <a class="shortcut" href="https://selectividad.intergranada.com/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        Intergranada
      </a>
      <a class="shortcut" href="https://yoquieroaprobar.es/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        Yo quiero aprobar
      </a>
      <a class="shortcut" href="https://onddiakademia.github.io/TaulaPeriodiko/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        Taula Periodikoa
      </a>
      <a class="shortcut" href="https://sintaxis.org/analizador/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        Sintaxis
      </a>
    </div>

    <p class="seccion-titulo">Horario</p>

    <div class="horario-container">
      <table class="horario" id="tabla-horario">
        <thead>
          <tr>
            <th></th>
            <th>Astelehena</th>
            <th>Asteartea</th>
            <th>Asteazkena</th>
            <th>Osteguna</th>
            <th>Ostirala</th>
          </tr>
        </thead>
        <tbody id="cuerpo-horario">
          <!-- Se genera con JavaScript -->
        </tbody>
      </table>
    </div>

    <div class="respaldo">
      <button id="btn-exportar-horario" type="button">Exportar horario</button>
      <button id="btn-importar-horario" type="button">Importar horario</button>
      <input type="file" id="input-archivo-horario" accept=".json">
    </div>

  </main>

  <footer>
    <p>Web personal</p>
  </footer>

  <script>
    var CLAVE_HORARIO = "horarioAkademia";

    var horas = ['16:00', '17:00', '18:00', '19:00'];
    var dias = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes'];
    var diasNombres = ['Astelehena', 'Asteartea', 'Asteazkena', 'Osteguna', 'Ostirala'];

    function cargarHorario() {
      try {
        var data = JSON.parse(localStorage.getItem(CLAVE_HORARIO));
        if (data && data.length === horas.length && data[0] && data[0].length === dias.length) {
          return data;
        }
      } catch (e) {}
      // Inicializar vacío: cada celda tiene 5 líneas
      return Array(horas.length).fill(null).map(function() {
        return Array(dias.length).fill(null).map(function() {
          return ['', '', '', '', ''];
        });
      });
    }

    function guardarHorario(datos) {
      localStorage.setItem(CLAVE_HORARIO, JSON.stringify(datos));
    }

    function renderHorario() {
      var datos = cargarHorario();
      var tbody = document.getElementById('cuerpo-horario');
      tbody.innerHTML = '';

      for (var i = 0; i < horas.length; i++) {
        var tr = document.createElement('tr');
        
        // Celda de hora
        var tdHora = document.createElement('td');
        tdHora.className = 'hora';
        tdHora.textContent = horas[i];
        tr.appendChild(tdHora);

        for (var j = 0; j < dias.length; j++) {
          var td = document.createElement('td');
          
          var celda = document.createElement('div');
          celda.className = 'celda fila-' + i;
          
          // 5 líneas por celda
          for (var k = 0; k < 5; k++) {
            var input = document.createElement('input');
            input.type = 'text';
            input.value = (datos[i][j] && datos[i][j][k]) || '';
            input.placeholder = '';
            input.setAttribute('data-fila', i);
            input.setAttribute('data-col', j);
            input.setAttribute('data-linea', k);
            
            input.addEventListener('input', function() {
              var fila = parseInt(this.getAttribute('data-fila'));
              var col = parseInt(this.getAttribute('data-col'));
              var linea = parseInt(this.getAttribute('data-linea'));
              var datosActuales = cargarHorario();
              if (!datosActuales[fila][col]) {
                datosActuales[fila][col] = ['', '', '', '', ''];
              }
              datosActuales[fila][col][linea] = this.value;
              guardarHorario(datosActuales);
            });

            celda.appendChild(input);
          }

          td.appendChild(celda);
          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      }
    }

    function exportarHorario() {
      var datos = cargarHorario();
      var blob = new Blob([JSON.stringify(datos, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "horario_akademia_" + new Date().toISOString().slice(0,10) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importarHorario(evento) {
      var archivo = evento.target.files[0];
      if (!archivo) return;

      var lector = new FileReader();
      lector.onload = function(e) {
        try {
          var datos = JSON.parse(e.target.result);
          if (Array.isArray(datos) && datos.length === horas.length) {
            if (confirm("¿Importar horario? Se sobrescribirán los datos actuales.")) {
              guardarHorario(datos);
              renderHorario();
              alert("Horario importado correctamente.");
            }
          } else {
            alert("El archivo no tiene el formato correcto.");
          }
        } catch (error) {
          alert("Error al leer el archivo: " + error.message);
        }
      };
      lector.readAsText(archivo);
      document.getElementById('input-archivo-horario').value = "";
    }

    document.getElementById('btn-exportar-horario').addEventListener('click', exportarHorario);
    document.getElementById('btn-importar-horario').addEventListener('click', function() {
      document.getElementById('input-archivo-horario').click();
    });
    document.getElementById('input-archivo-horario').addEventListener('change', importarHorario);

    renderHorario();
  </script>
</body>
</html>
