<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #f2ecdf;
      --fondo-tarjeta: #faf6ee;
      --texto: #3a352d;
      --texto-suave: #7a7264;
      --borde: #ddd3c0;
      --acento: #8a7a5c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--fondo);
      color: var(--texto);
      font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      width: 100%;
      max-width: 720px;
      padding: 40px 24px 64px;
    }

    .seccion-titulo {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--texto-suave);
      margin-bottom: 16px;
      border-bottom: 1px solid var(--borde);
      padding-bottom: 8px;
    }

    .shortcuts {
      display: flex;
      gap: 10px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .shortcut {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.2s ease;
      gap: 6px;
    }

    .shortcut:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .shortcut svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .tarjeta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 16px;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .tarjeta:hover {
      box-shadow: 0 4px 14px rgba(58, 53, 45, 0.08);
      transform: translateY(-1px);
    }

    .tarjeta h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .boton {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid var(--acento);
      background-color: transparent;
      color: var(--acento);
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .boton:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
    }

    footer {
      margin-top: auto;
      padding: 24px;
      font-size: 0.8rem;
      color: var(--texto-suave);
    }

    @media (max-width: 540px) {
      .shortcuts {
        flex-direction: column;
      }

      .shortcut {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="seccion-titulo">Accesos directos</p>

    <div class="shortcuts">
      <a class="shortcut" href="https://mail.google.com" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        Gmail
      </a>
      <a class="shortcut" href="https://drive.google.com" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        Drive
      </a>
      <a class="shortcut" href="https://es.wikipedia.org/wiki/Anna%27s_Archive" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        Anna's Archive
      </a>
    </div>

    <p class="seccion-titulo">Páginas</p>

    <div class="tarjeta">
      <h2>Lista de libros</h2>
      <a class="boton" href="./libros/">Abrir</a>
    </div>
  </main>

  <footer>
    <p>Web personal</p>
  </footer>
</body>
</html>
