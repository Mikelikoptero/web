<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #f2ecdf;
      --fondo-tarjeta: #faf6ee;
      --texto: #3a352d;
      --texto-suave: #7a7264;
      --borde: #ddd3c0;
      --acento: #8a7a5c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--fondo);
      color: var(--texto);
      font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      width: 100%;
      max-width: 720px;
      padding: 40px 24px 64px;
    }

    .seccion-titulo {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--texto-suave);
      margin-bottom: 16px;
      border-bottom: 1px solid var(--borde);
      padding-bottom: 8px;
    }

    /* Widget del tiempo */
    .tiempo-widget {
      display: flex;
      align-items: center;
      gap: 16px;
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .tiempo-widget .icono-tiempo {
      font-size: 2rem;
      line-height: 1;
    }

    .tiempo-widget .info-tiempo {
      display: flex;
      flex-direction: column;
    }

    .tiempo-widget .temperatura {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .tiempo-widget .descripcion {
      color: var(--texto-suave);
      font-size: 0.9rem;
    }

    .tiempo-widget .ciudad {
      color: var(--texto-suave);
      font-size: 0.8rem;
      margin-left: auto;
    }

    .tiempo-widget .cargando {
      color: var(--texto-suave);
      font-size: 0.9rem;
    }

    /* Notas rápidas */
    .notas-widget {
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 32px;
    }

    .notas-widget textarea {
      width: 100%;
      min-height: 80px;
      padding: 10px 12px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo);
      color: var(--texto);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      resize: vertical;
      transition: border-color 0.2s ease;
      line-height: 1.5;
    }

    .notas-widget textarea:focus {
      border-color: var(--acento);
    }

    .notas-widget textarea::placeholder {
      color: var(--texto-suave);
      opacity: 0.5;
    }

    .notas-widget .info-notas {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .notas-widget .info-notas span {
      font-size: 0.75rem;
      color: var(--texto-suave);
    }

    /* Accesos directos */
    .shortcuts {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .shortcuts.fila {
      margin-bottom: 10px;
    }

    .shortcuts.fila:last-child {
      margin-bottom: 16px;
    }

    .shortcut {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.2s ease;
      gap: 6px;
      flex: 1;
      min-width: 80px;
      max-width: 160px;
    }

    .shortcut:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .shortcut svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .menu-desplegable {
      margin-bottom: 32px;
    }

    .menu-desplegable .boton-menu {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      gap: 6px;
    }

    .menu-desplegable .boton-menu:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .menu-desplegable .boton-menu svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .menu-desplegable .boton-menu.abierto svg {
      transform: rotate(180deg);
    }

    .menu-desplegable .contenido-menu {
      display: none;
      margin-top: 10px;
      padding: 10px 0 0 0;
      flex-wrap: wrap;
      gap: 10px;
    }

    .menu-desplegable .contenido-menu.abierto {
      display: flex;
    }

    .menu-desplegable .contenido-menu .shortcut {
      flex: 1;
      min-width: 80px;
      max-width: 160px;
    }

    .tarjeta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 16px;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .tarjeta:hover {
      box-shadow: 0 4px 14px rgba(58, 53, 45, 0.08);
      transform: translateY(-1px);
    }

    .tarjeta h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .boton {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid var(--acento);
      background-color: transparent;
      color: var(--acento);
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .boton:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
    }

    footer {
      margin-top: auto;
      padding: 24px;
      font-size: 0.8rem;
      color: var(--texto-suave);
    }

    @media (max-width: 540px) {
      .shortcut {
        flex: 1 1 calc(50% - 10px);
        max-width: none;
        justify-content: center;
      }

      .shortcuts.fila {
        flex-wrap: wrap;
      }

      .menu-desplegable .contenido-menu .shortcut {
        flex: 1 1 calc(50% - 10px);
        max-width: none;
        justify-content: center;
      }

      .menu-desplegable .contenido-menu {
        flex-wrap: wrap;
      }

      .tiempo-widget {
        flex-direction: column;
        align-items: flex-start;
      }

      .tiempo-widget .ciudad {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="seccion-titulo">Widgets</p>

    <!-- Widget del tiempo -->
    <div class="tiempo-widget" id="tiempo-widget">
      <div class="icono-tiempo" id="icono-tiempo">⏳</div>
      <div class="info-tiempo">
        <div class="temperatura" id="temperatura">--°C</div>
        <div class="descripcion" id="descripcion">Cargando...</div>
      </div>
      <div class="ciudad" id="ciudad">--</div>
    </div>

    <!-- Notas rápidas -->
    <div class="notas-widget">
      <div class="info-notas">
        <span>Notas rápidas</span>
        <span id="contador-notas">0 caracteres</span>
      </div>
      <textarea id="notas-textarea" placeholder="Escribe aquí tus notas rápidas..."></textarea>
    </div>

    <p class="seccion-titulo">Accesos directos</p>

    <div class="shortcuts fila">
      <a class="shortcut" href="https://mail.google.com" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        Gmail
      </a>
      <a class="shortcut" href="https://drive.google.com" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        Drive
      </a>
      <a class="shortcut" href="https://appflowy.com/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        AppFlowy
      </a>
      <a class="shortcut" href="https://stirling.com/app" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        Stirling
      </a>
    </div>

    <div class="shortcuts fila">
      <a class="shortcut" href="https://es.wikipedia.org/wiki/Anna%27s_Archive" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        Anna's Archive
      </a>
      <a class="shortcut" href="https://www.wordreference.com/es/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        WordReference
      </a>
      <a class="shortcut" href="https://hiztegiak.elhuyar.eus/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        Elhuyar
      </a>
      <span class="shortcut" style="visibility:hidden;pointer-events:none;"></span>
    </div>

    <div class="menu-desplegable">
      <button class="boton-menu" id="boton-video" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
        Video
      </button>
      <div class="contenido-menu" id="menu-video">
        <a class="shortcut" href="https://rbtv77apk.app/rbtv77-web/" target="_blank" rel="noopener noreferrer">
          RBTV77
        </a>
        <a class="shortcut" href="https://github.com/yarrlist" target="_blank" rel="noopener noreferrer">
          Yarrlist
        </a>
      </div>
    </div>

    <p class="seccion-titulo">Páginas</p>

    <div class="tarjeta">
      <h2>Lista de libros</h2>
      <a class="boton" href="./libros/">Abrir</a>
    </div>

    <div class="tarjeta">
      <h2>Akademia</h2>
      <a class="boton" href="./akademia/">Abrir</a>
    </div>

    <div class="tarjeta">
      <h2>Rutinas</h2>
      <a class="boton" href="./rutinas/">Abrir</a>
    </div>
  </main>

  <footer>
    <p>Web personal</p>
  </footer>

  <script>
    // ===== NOTAS RÁPIDAS =====
    var CLAVE_NOTAS = "notasRapidas";
    var textareaNotas = document.getElementById('notas-textarea');
    var contadorNotas = document.getElementById('contador-notas');

    function cargarNotas() {
      try {
        var notas = localStorage.getItem(CLAVE_NOTAS);
        if (notas !== null) {
          textareaNotas.value = notas;
          actualizarContador();
        }
      } catch (e) {}
    }

    function guardarNotas() {
      localStorage.setItem(CLAVE_NOTAS, textareaNotas.value);
      actualizarContador();
    }

    function actualizarContador() {
      var caracteres = textareaNotas.value.length;
      contadorNotas.textContent = caracteres + ' caracteres';
    }

    textareaNotas.addEventListener('input', guardarNotas);
    cargarNotas();

    // ===== WIDGET DEL TIEMPO =====
    var CLAVE_TIEMPO = "tiempoCache";

    function obtenerTiempo() {
      var ciudad = 'Bilbao'; // Puedes cambiarlo por tu ciudad
      var url = 'https://wttr.in/' + ciudad + '?format=%C|%t|%l&lang=es';
      
      // Intentar cargar desde caché
      var cache = localStorage.getItem(CLAVE_TIEMPO);
      if (cache) {
        try {
          var datosCache = JSON.parse(cache);
          var ahora = new Date().getTime();
          // Si la caché tiene menos de 30 minutos, usarla
          if (ahora - datosCache.timestamp < 30 * 60 * 1000) {
            actualizarWidget(datosCache.datos);
            return;
          }
        } catch (e) {}
      }

      // Si no hay caché o ha expirado, hacer la petición
      fetch(url)
        .then(function(response) {
          if (!response.ok) throw new Error('Error al obtener el tiempo');
          return response.text();
        })
        .then(function(data) {
          var partes = data.split('|');
          var descripcion = partes[0].trim();
          var temperatura = partes[1].trim();
          var localidad = partes[2].trim();
          
          var datos = {
            descripcion: descripcion,
            temperatura: temperatura,
            ciudad: localidad
          };
          
          // Guardar en caché
          localStorage.setItem(CLAVE_TIEMPO, JSON.stringify({
            timestamp: new Date().getTime(),
            datos: datos
          }));
          
          actualizarWidget(datos);
        })
        .catch(function(error) {
          console.error('Error al obtener el tiempo:', error);
          document.getElementById('icono-tiempo').textContent = '❓';
          document.getElementById('descripcion').textContent = 'No disponible';
        });
    }

    function actualizarWidget(datos) {
      document.getElementById('icono-tiempo').textContent = obtenerIcono(datos.descripcion);
      document.getElementById('temperatura').textContent = datos.temperatura || '--°C';
      document.getElementById('descripcion').textContent = datos.descripcion || '--';
      document.getElementById('ciudad').textContent = datos.ciudad || '--';
    }

    function obtenerIcono(descripcion) {
      var desc = descripcion.toLowerCase();
      if (desc.includes('soleado') || desc.includes('despejado') || desc.includes('sunny')) return '☀️';
      if (desc.includes('parcialmente nublado') || desc.includes('nubes dispersas')) return '⛅';
      if (desc.includes('nublado') || desc.includes('cloudy') || desc.includes('overcast')) return '☁️';
      if (desc.includes('lluvia') || desc.includes('rain') || desc.includes('chubascos')) return '🌧️';
      if (desc.includes('tormenta') || desc.includes('thunder') || desc.includes('storm')) return '⛈️';
      if (desc.includes('nieve') || desc.includes('snow')) return '❄️';
      if (desc.includes('niebla') || desc.includes('fog') || desc.includes('mist')) return '🌫️';
      if (desc.includes('viento') || desc.includes('windy')) return '💨';
      return '🌤️';
    }

    // Cargar el tiempo al inicio
    obtenerTiempo();
    // Actualizar cada 30 minutos
    setInterval(obtenerTiempo, 30 * 60 * 1000);

    // ===== MENÚ VIDEO =====
    document.getElementById('boton-video').addEventListener('click', function() {
      var menu = document.getElementById('menu-video');
      var boton = this;
      menu.classList.toggle('abierto');
      boton.classList.toggle('abierto');
    });
  </script>
</body>
</html>
