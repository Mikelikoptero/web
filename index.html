<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #f2ecdf;
      --fondo-tarjeta: #faf6ee;
      --texto: #3a352d;
      --texto-suave: #7a7264;
      --borde: #ddd3c0;
      --acento: #8a7a5c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--fondo);
      color: var(--texto);
      font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      width: 100%;
      max-width: 720px;
      padding: 40px 24px 64px;
    }

    .seccion-titulo {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--texto-suave);
      margin-bottom: 16px;
      border-bottom: 1px solid var(--borde);
      padding-bottom: 8px;
    }

    /* Widget del tiempo */
    .tiempo-widget {
      display: flex;
      align-items: center;
      gap: 16px;
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      text-decoration: none;
      color: var(--texto);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .tiempo-widget:hover {
      box-shadow: 0 4px 14px rgba(58, 53, 45, 0.08);
      transform: translateY(-1px);
    }

    .tiempo-widget .icono-tiempo {
      font-size: 2.4rem;
      line-height: 1;
    }

    .tiempo-widget .info-tiempo {
      display: flex;
      flex-direction: column;
    }

    .tiempo-widget .temperatura {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .tiempo-widget .descripcion {
      color: var(--texto-suave);
      font-size: 0.9rem;
    }

    .tiempo-widget .ciudad {
      color: var(--texto-suave);
      font-size: 0.8rem;
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tiempo-widget .ciudad svg {
      width: 14px;
      height: 14px;
    }

    .tiempo-widget .cargando {
      color: var(--texto-suave);
      font-size: 0.9rem;
    }

    .tiempo-widget .fuente {
      font-size: 0.6rem;
      color: var(--texto-suave);
      opacity: 0.5;
      margin-left: auto;
      width: 100%;
      text-align: right;
    }

    /* Notas rápidas */
    .notas-widget {
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 32px;
    }

    .notas-widget textarea {
      width: 100%;
      min-height: 80px;
      padding: 10px 12px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo);
      color: var(--texto);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      resize: vertical;
      transition: border-color 0.2s ease;
      line-height: 1.5;
    }

    .notas-widget textarea:focus {
      border-color: var(--acento);
    }

    .notas-widget textarea::placeholder {
      color: var(--texto-suave);
      opacity: 0.5;
    }

    .notas-widget .info-notas {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .notas-widget .info-notas span {
      font-size: 0.75rem;
      color: var(--texto-suave);
    }

    /* Accesos directos */
    .shortcuts {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .shortcuts.fila {
      margin-bottom: 10px;
    }

    .shortcuts.fila:last-child {
      margin-bottom: 16px;
    }

    .shortcut {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.2s ease;
      gap: 6px;
      flex: 1;
      min-width: 80px;
      max-width: 160px;
    }

    .shortcut:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .shortcut svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .menu-desplegable {
      margin-bottom: 32px;
    }

    .menu-desplegable .boton-menu {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      gap: 6px;
    }

    .menu-desplegable .boton-menu:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .menu-desplegable .boton-menu svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .menu-desplegable .boton-menu.abierto svg {
      transform: rotate(180deg);
    }

    .menu-desplegable .contenido-menu {
      display: none;
      margin-top: 10px;
      padding: 10px 0 0 0;
      flex-wrap: wrap;
      gap: 10px;
    }

    .menu-desplegable .contenido-menu.abierto {
      display: flex;
    }

    .menu-desplegable .contenido-menu .shortcut {
      flex: 1;
      min-width: 80px;
      max-width: 160px;
    }

    .tarjeta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 16px;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .tarjeta:hover {
      box-shadow: 0 4px 14px rgba(58, 53, 45, 0.08);
      transform: translateY(-1px);
    }

    .tarjeta h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .boton {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid var(--acento);
      background-color: transparent;
      color: var(--acento);
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .boton:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
    }

    footer {
      margin-top: auto;
      padding: 24px;
      font-size: 0.8rem;
      color: var(--texto-suave);
    }

    @media (max-width: 540px) {
      .shortcut {
        flex: 1 1 calc(50% - 10px);
        max-width: none;
        justify-content: center;
      }

      .shortcuts.fila {
        flex-wrap: wrap;
      }

      .menu-desplegable .contenido-menu .shortcut {
        flex: 1 1 calc(50% - 10px);
        max-width: none;
        justify-content: center;
      }

      .menu-desplegable .contenido-menu {
        flex-wrap: wrap;
      }

      .tiempo-widget {
        flex-direction: column;
        align-items: flex-start;
      }

      .tiempo-widget .ciudad {
        margin-left: 0;
      }

      .tiempo-widget .fuente {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="seccion-titulo">Widgets</p>

    <!-- Widget del tiempo -->
    <a class="tiempo-widget" id="tiempo-widget" href="https://www.euskalmet.euskadi.eus/eguraldia/hernani/" target="_blank" rel="noopener noreferrer">

          <path d="M2 12l10 5 10-5"/>
        </svg>

  <footer>

  <script>
    // ===== NOTAS RÁPIDAS =====
    var CLAVE_NOTAS = "notasRapidas";
    var textareaNotas = document.getElementById('notas-textarea');
    var contadorNotas = document.getElementById('contador-notas');

    function cargarNotas() {
      try {
        var notas = localStorage.getItem(CLAVE_NOTAS);
        if (notas !== null) {
          textareaNotas.value = notas;
          actualizarContador();
        }
      } catch (e) {}
    }

    function guardarNotas() {
      localStorage.setItem(CLAVE_NOTAS, textareaNotas.value);
      actualizarContador();
    }

    function actualizarContador() {
      var caracteres = textareaNotas.value.length;
      contadorNotas.textContent = caracteres + ' caracteres';
    }

    textareaNotas.addEventListener('input', guardarNotas);
    cargarNotas();

    // ===== WIDGET DEL TIEMPO (Euskalmet) =====
    function obtenerTiempoEuskalmet() {
      // Usar la API de Euskalmet para Hernani (código municipal: 2003)
      var url = 'https://www.euskalmet.euskadi.eus/api/estado/2003';
      
      fetch(url)
        .then(function(response) {
          if (!response.ok) throw new Error('Error al obtener el tiempo');
          return response.json();
        })
        .then(function(data) {
          // La estructura de la API de Euskalmet puede variar
          // Esta es una estructura típica
          if (data && data.properties) {
            var temp = data.properties.temperatura || '--';
            var icono = data.properties.ikonoa || '';
            var descripcion = data.properties.eguraldia || '';
            
            actualizarWidgetEuskalmet(temp, icono, descripcion);
          } else {
            // Fallback: usar wttr.in si Euskalmet no responde como esperamos
            obtenerTiempoWTTR();
          }
        })
        .catch(function(error) {
          console.error('Error con Euskalmet:', error);
          // Fallback a wttr.in
          obtenerTiempoWTTR();
        });
    }

    // Fallback con wttr.in (más fiable)
    function obtenerTiempoWTTR() {
      var url = 'https://wttr.in/Hernani?format=j1&lang=es';
      
      fetch(url)
        .then(function(response) {
          if (!response.ok) throw new Error('Error al obtener el tiempo');
          return response.json();
        })
        .then(function(data) {
          var current = data.current_condition[0];
          var descripcion = current.lang_es ? current.lang_es[0].value : current.weatherDesc[0].value;
          var temperatura = current.temp_C;
          var localidad = data.nearest_area[0].areaName[0].value;
          
          actualizarWidgetConDatos(descripcion, temperatura, localidad);
        })
        .catch(function(error) {
          console.error('Error al obtener el tiempo:', error);
          document.getElementById('icono-tiempo').textContent = '❓';
          document.getElementById('descripcion').textContent = 'No disponible';
          document.getElementById('temperatura').textContent = '--°C';
        });
    }

    function actualizarWidgetEuskalmet(temp, icono, descripcion) {
      document.getElementById('icono-tiempo').textContent = icono || obtenerIconoPorDescripcion(descripcion);
      document.getElementById('temperatura').textContent = temp + '°C';
      document.getElementById('descripcion').textContent = descripcion || '--';
      document.getElementById('ciudad').innerHTML = 'Hernani <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
    }

    function actualizarWidgetConDatos(descripcion, temperatura, localidad) {
      document.getElementById('icono-tiempo').textContent = obtenerIcono(descripcion);
      document.getElementById('temperatura').textContent = temperatura + '°C';
      document.getElementById('descripcion').textContent = descripcion;
      document.getElementById('ciudad').innerHTML = localidad + ' <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
    }

    function obtenerIcono(descripcion) {
      var desc = descripcion.toLowerCase();
      if (desc.includes('soleado') || desc.includes('despejado') || desc.includes('sunny')) return '☀️';
      if (desc.includes('parcialmente nublado') || desc.includes('nubes dispersas')) return '⛅';
      if (desc.includes('nublado') || desc.includes('cloudy') || desc.includes('overcast')) return '☁️';
      if (desc.includes('lluvia') || desc.includes('rain') || desc.includes('chubascos')) return '🌧️';
      if (desc.includes('tormenta') || desc.includes('thunder') || desc.includes('storm')) return '⛈️';
      if (desc.includes('nieve') || desc.includes('snow')) return '❄️';
      if (desc.includes('niebla') || desc.includes('fog') || desc.includes('mist')) return '🌫️';
      if (desc.includes('viento') || desc.includes('windy')) return '💨';
      return '🌤️';
    }

    function obtenerIconoPorDescripcion(descripcion) {
      // Para el caso de que Euskalmet devuelva el icono en texto
      var desc = (descripcion || '').toLowerCase();
      if (desc.includes('eguzki') || desc.includes('argi')) return '☀️';
      if (desc.includes('hodei') && desc.includes('partzial')) return '⛅';
      if (desc.includes('hodei')) return '☁️';
      if (desc.includes('euri')) return '🌧️';
      if (desc.includes('ekaitz')) return '⛈️';
      if (desc.includes('elur')) return '❄️';
      if (desc.includes('laino')) return '🌫️';
      if (desc.includes('haize')) return '💨';
      return '🌤️';
    }

    // Cargar el tiempo al inicio (intentar Euskalmet primero)
    obtenerTiempoEuskalmet();
    // Actualizar cada 30 minutos
    setInterval(obtenerTiempoEuskalmet, 30 * 60 * 1000);

    // ===== MENÚ VIDEO =====
    document.getElementById('boton-video').addEventListener('click', function() {
      var menu = document.getElementById('menu-video');
      var boton = this;
      menu.classList.toggle('abierto');
      boton.classList.toggle('abierto');
    });
  </script>
</body>
</html>
