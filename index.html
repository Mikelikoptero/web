<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #f2ecdf;
      --fondo-tarjeta: #faf6ee;
      --texto: #3a352d;
      --texto-suave: #7a7264;
      --borde: #ddd3c0;
      --acento: #8a7a5c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--fondo);
      color: var(--texto);
      font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      width: 100%;
      max-width: 720px;
      padding: 40px 24px 64px;
    }

    .seccion-titulo {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--texto-suave);
      margin-bottom: 16px;
      border-bottom: 1px solid var(--borde);
      padding-bottom: 8px;
    }

    .shortcuts {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .shortcut {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.2s ease;
      gap: 6px;
    }

    .shortcut:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .shortcut svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .menus-container {
      display: flex;
      gap: 10px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .menu-desplegable {
      flex: 0 1 auto;
    }

    .menu-desplegable .boton-menu {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      gap: 6px;
    }

    .menu-desplegable .boton-menu:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .menu-desplegable .boton-menu svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .menu-desplegable .boton-menu.abierto svg {
      transform: rotate(180deg);
    }

    .menu-desplegable .contenido-menu {
      display: none;
      margin-top: 10px;
      padding: 10px 0 0 0;
      flex-wrap: wrap;
      gap: 10px;
      position: absolute;
      background-color: var(--fondo);
      border-radius: 10px;
      padding: 10px;
      min-width: 150px;
      box-shadow: 0 4px 14px rgba(58, 53, 45, 0.12);
      border: 1px solid var(--borde);
      z-index: 10;
    }

    .menu-desplegable .contenido-menu.abierto {
      display: flex;
    }

    .menu-desplegable .contenido-menu .shortcut {
      margin-bottom: 0;
      width: 100%;
    }

    .menu-desplegable {
      position: relative;
    }

    .tarjeta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 16px;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .tarjeta:hover {
      box-shadow: 0 4px 14px rgba(58, 53, 45, 0.08);
      transform: translateY(-1px);
    }

    .tarjeta h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .boton {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid var(--acento);
      background-color: transparent;
      color: var(--acento);
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .boton:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
    }

    footer {
      margin-top: auto;
      padding: 24px;
      font-size: 0.8rem;
      color: var(--texto-suave);
    }

    @media (max-width: 540px) {
      .shortcuts {
        flex-direction: column;
      }

      .shortcut {
        justify-content: center;
      }

      .menus-container {
        flex-direction: column;
      }

      .menu-desplegable .contenido-menu {
        position: static;
        box-shadow: none;
        border: none;
        padding: 10px 0 0 0;
        background-color: transparent;
      }

      .menu-desplegable .contenido-menu .shortcut {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="seccion-titulo">Accesos directos</p>

    <div class="shortcuts">
      <a class="shortcut" href="https://mail.google.com" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        Gmail
      </a>
      <a class="shortcut" href="https://drive.google.com" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        Drive
      </a>
      <a class="shortcut" href="https://es.wikipedia.org/wiki/Anna%27s_Archive" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        Anna's Archive
      </a>
      <a class="shortcut" href="https://www.wordreference.com/es/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        WordReference
      </a>
      <a class="shortcut" href="https://hiztegiak.elhuyar.eus/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        Elhuyar
      </a>
    </div>

    <div class="menus-container">
      <div class="menu-desplegable">
        <button class="boton-menu" id="boton-akademia" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
          Akademia
        </button>
        <div class="contenido-menu" id="menu-akademia">
          <a class="shortcut" href="https://www.desmos.com/calculator?lang=es" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
              <line x1="12" y1="22.08" x2="12" y2="12"/>
            </svg>
            Desmos
          </a>
          <a class="shortcut" href="https://selectividad.intergranada.com/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
            Intergranada
          </a>
          <a class="shortcut" href="https://yoquieroaprobar.es/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            Yo quiero aprobar
          </a>
          <a class="shortcut" href="https://onddiakademia.github.io/TaulaPeriodiko/" target="_blank" rel="noopener noreferrer">
            Taula Periodikoa
          </a>
          <a class="shortcut" href="https://sintaxis.org/analizador/" target="_blank" rel="noopener noreferrer">
            Sintaxis
          </a>
        </div>
      </div>

      <div class="menu-desplegable">
        <button class="boton-menu" id="boton-video" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
          Video
        </button>
        <div class="contenido-menu" id="menu-video">
          <a class="shortcut" href="https://rbtv77apk.app/rbtv77-web/" target="_blank" rel="noopener noreferrer">
            RBTV77
          </a>
          <a class="shortcut" href="https://github.com/yarrlist" target="_blank" rel="noopener noreferrer">
            Yarrlist
          </a>
        </div>
      </div>
    </div>

    <p class="seccion-titulo">Páginas</p>

    <div class="tarjeta">
      <h2>Lista de libros</h2>
      <a class="boton" href="./libros/">Abrir</a>
    </div>
  </main>

  <footer>
    <p>Web personal</p>
  </footer>

  <script>
    var menuAkademia = document.getElementById('menu-akademia');
    var botonAkademia = document.getElementById('boton-akademia');
    var menuVideo = document.getElementById('menu-video');
    var botonVideo = document.getElementById('boton-video');

    function toggleMenu(menu, boton, otroMenu, otroBoton) {
      if (menu.classList.contains('abierto')) {
        menu.classList.remove('abierto');
        boton.classList.remove('abierto');
        return;
      }

      if (otroMenu.classList.contains('abierto')) {
        otroMenu.classList.remove('abierto');
        otroBoton.classList.remove('abierto');
      }

      menu.classList.add('abierto');
      boton.classList.add('abierto');
    }

    botonAkademia.addEventListener('click', function() {
      toggleMenu(menuAkademia, botonAkademia, menuVideo, botonVideo);
    });

    botonVideo.addEventListener('click', function() {
      toggleMenu(menuVideo, botonVideo, menuAkademia, botonAkademia);
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.menu-desplegable')) {
        menuAkademia.classList.remove('abierto');
        botonAkademia.classList.remove('abierto');
        menuVideo.classList.remove('abierto');
        botonVideo.classList.remove('abierto');
      }
    });
  </script>
</body>
</html>
