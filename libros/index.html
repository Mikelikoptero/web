<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de libros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #f2ecdf;
      --fondo-tarjeta: #faf6ee;
      --texto: #3a352d;
      --texto-suave: #7a7264;
      --borde: #ddd3c0;
      --acento: #8a7a5c;
      --estrella: #d4a373;
      --estrella-vacia: #e8ddd0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--fondo);
      color: var(--texto);
      font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 720px;
      padding: 64px 24px 24px;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 2.6rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .volver {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--texto-suave);
      text-decoration: none;
      border-bottom: 1px solid var(--borde);
      padding-bottom: 1px;
    }

    .volver:hover {
      color: var(--acento);
      border-bottom-color: var(--acento);
    }

    main {
      width: 100%;
      max-width: 720px;
      padding: 0 24px 64px;
    }

    .selector {
      display: flex;
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 6px;
      margin-bottom: 28px;
      gap: 6px;
    }

    .selector button {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 7px;
      background-color: transparent;
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .selector button.activo {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
    }

    .fila-entrada {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .fila-entrada input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .fila-entrada input:focus {
      border-color: var(--acento);
    }

    .fila-entrada input::placeholder {
      color: var(--texto-suave);
    }

    .boton-cuadrado {
      flex: none;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--acento);
      border-radius: 8px;
      background-color: transparent;
      color: var(--acento);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .boton-cuadrado:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
    }

    .boton-cuadrado svg {
      width: 18px;
      height: 18px;
    }

    .libro {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .libro .info {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 150px;
    }

    .libro .info .titulo {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .libro .info .autor {
      color: var(--texto-suave);
      font-size: 0.95rem;
    }

    .libro .fecha {
      font-size: 0.8rem;
      color: var(--texto-suave);
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .libro .fecha span {
      font-weight: 500;
      color: var(--texto);
    }

    .libro .fecha .boton-editar-fecha {
      background: none;
      border: 1px solid var(--borde);
      border-radius: 4px;
      padding: 2px 6px;
      color: var(--texto-suave);
      cursor: pointer;
      font-size: 0.7rem;
      line-height: 1;
      transition: all 0.2s ease;
      opacity: 0.5;
    }

    .libro .fecha .boton-editar-fecha:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
      opacity: 1;
    }

    .libro .fecha .editor-fecha {
      display: none;
      gap: 4px;
      align-items: center;
    }

    .libro .fecha .editor-fecha.visible {
      display: flex;
    }

    .libro .fecha .editor-fecha input[type="date"] {
      padding: 2px 6px;
      border: 1px solid var(--borde);
      border-radius: 4px;
      background-color: var(--fondo);
      color: var(--texto);
      font-family: inherit;
      font-size: 0.7rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s ease;
      max-width: 120px;
    }

    .libro .fecha .editor-fecha input[type="date"]:focus {
      border-color: var(--acento);
    }

    .libro .fecha .editor-fecha input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0.6;
      cursor: pointer;
    }

    .libro .fecha .editor-fecha input[type="date"]:hover::-webkit-calendar-picker-indicator {
      opacity: 1;
    }

    .libro .fecha .editor-fecha .boton-fecha-pequeno {
      padding: 2px 8px;
      border: 1px solid var(--borde);
      border-radius: 4px;
      background-color: var(--fondo);
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .libro .fecha .editor-fecha .boton-fecha-pequeno:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .libro .fecha .editor-fecha .boton-fecha-pequeno.activo {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .estrellas {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .estrella-btn {
      background: none;
      border: none;
      padding: 2px;
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      color: var(--estrella-vacia);
      transition: color 0.2s ease, transform 0.15s ease;
    }

    .estrella-btn:hover {
      transform: scale(1.1);
    }

    .estrella-btn.activa {
      color: var(--estrella);
    }

    .estrella-btn.activa:hover {
      color: #b8926a;
    }

    .libro .acciones {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .lista-vacia {
      color: var(--texto-suave);
      font-size: 0.9rem;
      text-align: center;
      padding: 32px 0;
      border: 1px dashed var(--borde);
      border-radius: 10px;
    }

    .oculto {
      display: none;
    }

    .ordenacion {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .ordenacion label {
      font-size: 0.85rem;
      color: var(--texto-suave);
      margin-right: 4px;
    }

    .ordenacion select {
      padding: 6px 10px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .ordenacion select:focus {
      border-color: var(--acento);
    }

    .ordenacion button {
      padding: 6px 14px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ordenacion button:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .ordenacion button.activo {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .respaldo {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--borde);
      flex-wrap: wrap;
      justify-content: center;
    }

    .respaldo button {
      padding: 10px 20px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .respaldo button:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .respaldo input[type="file"] {
      display: none;
    }

    footer {
      margin-top: auto;
      padding: 24px;
      font-size: 0.8rem;
      color: var(--texto-suave);
    }

    @media (max-width: 540px) {
      .fila-entrada {
        flex-wrap: wrap;
      }

      .fila-entrada input {
        flex: 1 1 100%;
      }

      .boton-cuadrado {
        width: 100%;
      }

      .libro {
        flex-direction: column;
        align-items: stretch;
      }

      .libro .info {
        min-width: unset;
      }

      .libro .acciones {
        align-items: stretch;
        padding-top: 4px;
        border-top: 1px solid var(--borde);
      }

      .libro .fecha {
        justify-content: flex-start;
      }

      .libro .fecha .editor-fecha {
        flex-wrap: wrap;
      }

      .libro .fecha .editor-fecha input[type="date"] {
        flex: 1;
        min-width: 100px;
        max-width: unset;
      }

      .ordenacion {
        flex-direction: column;
        align-items: stretch;
      }

      .ordenacion select {
        width: 100%;
      }

      .respaldo {
        flex-direction: column;
      }

      .respaldo button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Lista de libros</h1>
    <a class="volver" href="../">Volver al inicio</a>
  </header>

  <main>
    <div class="selector">
      <button id="tab-para-leer" class="activo" type="button">Para leer</button>
      <button id="tab-leidos" type="button">Leídos</button>
    </div>

    <div id="vista-para-leer">
      <div class="fila-entrada">
        <input id="input-titulo" type="text" placeholder="Título" autocomplete="off">
        <input id="input-autor" type="text" placeholder="Autor" autocomplete="off">
        <button class="boton-cuadrado" id="boton-anadir" type="button" title="Añadir libro" aria-label="Añadir libro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
      <div id="lista-para-leer"></div>
    </div>

    <div id="vista-leidos" class="oculto">
      <div class="ordenacion">
        <label for="orden-campo">Ordenar por:</label>
        <select id="orden-campo">
          <option value="fecha">Fecha</option>
          <option value="titulo">Título</option>
          <option value="autor">Autor</option>
        </select>
        <button id="orden-direction" type="button">Descendente ↓</button>
      </div>
      <div id="lista-leidos"></div>
    </div>

    <div class="respaldo">
      <button id="btn-exportar" type="button">Exportar datos</button>
      <button id="btn-importar" type="button">Importar datos</button>
      <input type="file" id="input-archivo" accept=".json">
    </div>
  </main>

  <footer>
    <p>Web personal</p>
  </footer>

  <script>
    var CLAVE_PARA_LEER = "librosParaLeer";
    var CLAVE_LEIDOS = "librosLeidos";

    var inputTitulo = document.getElementById("input-titulo");
    var inputAutor = document.getElementById("input-autor");
    var botonAnadir = document.getElementById("boton-anadir");
    var listaParaLeer = document.getElementById("lista-para-leer");
    var listaLeidos = document.getElementById("lista-leidos");
    var tabParaLeer = document.getElementById("tab-para-leer");
    var tabLeidos = document.getElementById("tab-leidos");
    var vistaParaLeer = document.getElementById("vista-para-leer");
    var vistaLeidos = document.getElementById("vista-leidos");
    var btnExportar = document.getElementById("btn-exportar");
    var btnImportar = document.getElementById("btn-importar");
    var inputArchivo = document.getElementById("input-archivo");
    var ordenCampo = document.getElementById("orden-campo");
    var ordenDirection = document.getElementById("orden-direction");

    var direccionAscendente = false;

    function cargar(clave) {
      try {
        return JSON.parse(localStorage.getItem(clave)) || [];
      } catch (e) {
        return [];
      }
    }

    function guardar(clave, datos) {
      localStorage.setItem(clave, JSON.stringify(datos));
    }

    function obtenerFechaActual() {
      var hoy = new Date();
      var dd = String(hoy.getDate()).padStart(2, '0');
      var mm = String(hoy.getMonth() + 1).padStart(2, '0');
      var yyyy = hoy.getFullYear();
      return yyyy + '-' + mm + '-' + dd;
    }

    function formatearFecha(fecha) {
      if (!fecha) return '';
      var partes = fecha.split('-');
      if (partes.length === 3) {
        return partes[2] + '/' + partes[1] + '/' + partes[0];
      }
      return fecha;
    }

    function svgTick() {
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "2");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      var path = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      path.setAttribute("points", "20 6 9 17 4 12");
      svg.appendChild(path);
      return svg;
    }

    function svgCalendar() {
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "2");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      svg.style.width = "12px";
      svg.style.height = "12px";
      
      var rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", "3");
      rect.setAttribute("y", "4");
      rect.setAttribute("width", "18");
      rect.setAttribute("height", "18");
      rect.setAttribute("rx", "2");
      rect.setAttribute("ry", "2");
      svg.appendChild(rect);
      
      var line1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line1.setAttribute("x1", "16");
      line1.setAttribute("y1", "2");
      line1.setAttribute("x2", "16");
      line1.setAttribute("y2", "6");
      svg.appendChild(line1);
      
      var line2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line2.setAttribute("x1", "8");
      line2.setAttribute("y1", "2");
      line2.setAttribute("x2", "8");
      line2.setAttribute("y2", "6");
      svg.appendChild(line2);
      
      var line3 = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line3.setAttribute("x1", "3");
      line3.setAttribute("y1", "10");
      line3.setAttribute("x2", "21");
      line3.setAttribute("y2", "10");
      svg.appendChild(line3);
      
      return svg;
    }

    function crearTextoLibroParaLeer(libro) {
      var span = document.createElement("span");
      span.className = "texto";
      var strong = document.createElement("strong");
      strong.textContent = libro.titulo || "Sin título";
      span.appendChild(strong);
      var autor = document.createElement("span");
      autor.className = "autor";
      autor.textContent = " - " + (libro.autor || "Autor desconocido");
      span.appendChild(autor);
      return span;
    }

    function crearInfoLibroLeido(libro) {
      var div = document.createElement("div");
      div.className = "info";

      var titulo = document.createElement("div");
      titulo.className = "titulo";
      titulo.textContent = libro.titulo || "Sin título";
      div.appendChild(titulo);

      var autor = document.createElement("div");
      autor.className = "autor";
      autor.textContent = libro.autor || "Autor desconocido";
      div.appendChild(autor);

      return div;
    }

    function mensajeVacio(texto) {
      var div = document.createElement("div");
      div.className = "lista-vacia";
      div.textContent = texto;
      return div;
    }

    function crearEstrellas(libro, indice) {
      var contenedor = document.createElement("div");
      contenedor.className = "estrellas";

      if (typeof libro.puntuacion === 'undefined') {
        libro.puntuacion = 0;
      }

      for (var i = 1; i <= 5; i++) {
        var btn = document.createElement("button");
        btn.className = "estrella-btn" + (i <= libro.puntuacion ? " activa" : "");
        btn.textContent = "★";
        btn.type = "button";
        btn.setAttribute("aria-label", "Puntuación " + i + " estrellas");
        
        btn.addEventListener("click", function(estrellaIndex) {
          return function() {
            actualizarPuntuacion(indice, estrellaIndex);
          };
        }(i));

        contenedor.appendChild(btn);
      }

      return contenedor;
    }

    function crearFechaLeido(libro, indice) {
      var contenedor = document.createElement("div");
      contenedor.className = "fecha";

      var textoFecha = document.createElement("span");
      if (libro.fecha) {
        textoFecha.textContent = formatearFecha(libro.fecha);
      } else {
        textoFecha.textContent = "Sin fecha";
        textoFecha.style.color = "var(--texto-suave)";
      }
      contenedor.appendChild(textoFecha);

      var botonEditar = document.createElement("button");
      botonEditar.className = "boton-editar-fecha";
      botonEditar.type = "button";
      botonEditar.title = "Editar fecha";
      botonEditar.setAttribute("aria-label", "Editar fecha");
      botonEditar.appendChild(svgCalendar());
      contenedor.appendChild(botonEditar);

      var editor = document.createElement("div");
      editor.className = "editor-fecha";

      var input = document.createElement("input");
      input.type = "date";
      input.value = libro.fecha || '';
      input.setAttribute("aria-label", "Fecha de finalización");
      
      var botonHoy = document.createElement("button");
      botonHoy.className = "boton-fecha-pequeno";
      botonHoy.textContent = "Hoy";
      botonHoy.type = "button";
      
      if (libro.fecha === obtenerFechaActual()) {
        botonHoy.classList.add("activo");
      }
      
      var botonGuardar = document.createElement("button");
      botonGuardar.className = "boton-fecha-pequeno";
      botonGuardar.textContent = "Guardar";
      botonGuardar.type = "button";

      var botonCancelar = document.createElement("button");
      botonCancelar.className = "boton-fecha-pequeno";
      botonCancelar.textContent = "×";
      botonCancelar.type = "button";
      botonCancelar.setAttribute("aria-label", "Cancelar");

      editor.appendChild(input);
      editor.appendChild(botonHoy);
      editor.appendChild(botonGuardar);
      editor.appendChild(botonCancelar);

      contenedor.appendChild(editor);

      function mostrarEditor() {
        contenedor.querySelector('.editor-fecha').classList.add('visible');
        input.focus();
      }

      function ocultarEditor() {
        contenedor.querySelector('.editor-fecha').classList.remove('visible');
      }

      function guardarFecha() {
        var fecha = input.value;
        actualizarFecha(indice, fecha);
        if (fecha === obtenerFechaActual()) {
          botonHoy.classList.add("activo");
        } else {
          botonHoy.classList.remove("activo");
        }
        ocultarEditor();
        // Actualizar el texto mostrado
        var span = contenedor.querySelector('span');
        if (fecha) {
          span.textContent = formatearFecha(fecha);
          span.style.color = "";
        } else {
          span.textContent = "Sin fecha";
          span.style.color = "var(--texto-suave)";
        }
      }

      botonEditar.addEventListener("click", function(e) {
        e.stopPropagation();
        if (editor.classList.contains('visible')) {
          ocultarEditor();
        } else {
          mostrarEditor();
        }
      });

      botonGuardar.addEventListener("click", function(e) {
        e.stopPropagation();
        guardarFecha();
      });

      botonCancelar.addEventListener("click", function(e) {
        e.stopPropagation();
        ocultarEditor();
      });

      botonHoy.addEventListener("click", function(e) {
        e.stopPropagation();
        var fechaHoy = obtenerFechaActual();
        input.value = fechaHoy;
        this.classList.add("activo");
      });

      input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          guardarFecha();
        }
        if (e.key === "Escape") {
          ocultarEditor();
        }
      });

      // Cerrar editor al hacer clic fuera
      document.addEventListener("click", function(e) {
        if (!contenedor.contains(e.target)) {
          ocultarEditor();
        }
      });

      return contenedor;
    }

    function actualizarPuntuacion(indice, puntuacion) {
      var leidos = cargar(CLAVE_LEIDOS);
      if (leidos[indice]) {
        leidos[indice].puntuacion = puntuacion;
        guardar(CLAVE_LEIDOS, leidos);
        renderLeidos();
      }
    }

    function actualizarFecha(indice, fecha) {
      var leidos = cargar(CLAVE_LEIDOS);
      if (leidos[indice]) {
        leidos[indice].fecha = fecha;
        guardar(CLAVE_LEIDOS, leidos);
        renderLeidos();
      }
    }

    function ordenarLibros(libros, campo, ascendente) {
      var copia = libros.slice();
      
      copia.sort(function(a, b) {
        var valorA, valorB;
        
        if (campo === 'fecha') {
          valorA = a.fecha || '';
          valorB = b.fecha || '';
          if (valorA === '' && valorB === '') return 0;
          if (valorA === '') return 1;
          if (valorB === '') return -1;
        } else if (campo === 'titulo') {
          valorA = (a.titulo || '').toLowerCase();
          valorB = (b.titulo || '').toLowerCase();
        } else if (campo === 'autor') {
          valorA = (a.autor || '').toLowerCase();
          valorB = (b.autor || '').toLowerCase();
        }
        
        if (valorA < valorB) return ascendente ? -1 : 1;
        if (valorA > valorB) return ascendente ? 1 : -1;
        return 0;
      });
      
      return copia;
    }

    function renderParaLeer() {
      var libros = cargar(CLAVE_PARA_LEER);
      listaParaLeer.innerHTML = "";
      if (libros.length === 0) {
        listaParaLeer.appendChild(mensajeVacio("Todavía no hay libros en la lista."));
        return;
      }
      libros.forEach(function (libro, indice) {
        var fila = document.createElement("div");
        fila.className = "libro";
        
        var info = document.createElement("div");
        info.className = "info";
        info.appendChild(crearTextoLibroParaLeer(libro));
        fila.appendChild(info);

        var acciones = document.createElement("div");
        acciones.className = "acciones";

        var tick = document.createElement("button");
        tick.className = "boton-cuadrado";
        tick.type = "button";
        tick.title = "Marcar como leído";
        tick.setAttribute("aria-label", "Marcar como leído");
        tick.appendChild(svgTick());
        tick.addEventListener("click", function () {
          marcarLeido(indice);
        });

        acciones.appendChild(tick);
        fila.appendChild(acciones);
        listaParaLeer.appendChild(fila);
      });
    }

    function renderLeidos() {
      var libros = cargar(CLAVE_LEIDOS);
      var campo = ordenCampo.value;
      var ascendente = direccionAscendente;
      
      var librosOrdenados = ordenarLibros(libros, campo, ascendente);
      
      listaLeidos.innerHTML = "";
      if (librosOrdenados.length === 0) {
        listaLeidos.appendChild(mensajeVacio("Todavía no hay libros leídos."));
        return;
      }
      
      librosOrdenados.forEach(function (libro) {
        var indiceReal = libros.indexOf(libro);
        
        var fila = document.createElement("div");
        fila.className = "libro";
        
        fila.appendChild(crearInfoLibroLeido(libro));

        var acciones = document.createElement("div");
        acciones.className = "acciones";
        acciones.appendChild(crearEstrellas(libro, indiceReal));
        acciones.appendChild(crearFechaLeido(libro, indiceReal));

        fila.appendChild(acciones);
        listaLeidos.appendChild(fila);
      });
    }

    function anadirLibro() {
      var titulo = inputTitulo.value.trim();
      var autor = inputAutor.value.trim();
      if (!titulo) {
        inputTitulo.focus();
        return;
      }
      var libros = cargar(CLAVE_PARA_LEER);
      libros.unshift({ titulo: titulo, autor: autor });
      guardar(CLAVE_PARA_LEER, libros);
      inputTitulo.value = "";
      inputAutor.value = "";
      inputTitulo.focus();
      renderParaLeer();
    }

    function marcarLeido(indice) {
      var paraLeer = cargar(CLAVE_PARA_LEER);
      var leidos = cargar(CLAVE_LEIDOS);
      var libro = paraLeer.splice(indice, 1)[0];
      libro.puntuacion = 0;
      libro.fecha = obtenerFechaActual();
      leidos.unshift(libro);
      guardar(CLAVE_PARA_LEER, paraLeer);
      guardar(CLAVE_LEIDOS, leidos);
      renderParaLeer();
      renderLeidos();
    }

    function mostrarParaLeer() {
      tabParaLeer.classList.add("activo");
      tabLeidos.classList.remove("activo");
      vistaParaLeer.classList.remove("oculto");
      vistaLeidos.classList.add("oculto");
    }

    function mostrarLeidos() {
      tabLeidos.classList.add("activo");
      tabParaLeer.classList.remove("activo");
      vistaLeidos.classList.remove("oculto");
      vistaParaLeer.classList.add("oculto");
      renderLeidos();
    }

    function toggleDirection() {
      direccionAscendente = !direccionAscendente;
      ordenDirection.textContent = direccionAscendente ? "Ascendente ↑" : "Descendente ↓";
      renderLeidos();
    }

    function cambiarOrden() {
      renderLeidos();
    }

    function exportarDatos() {
      var datos = {
        paraLeer: cargar(CLAVE_PARA_LEER),
        leidos: cargar(CLAVE_LEIDOS),
        fecha: new Date().toISOString()
      };
      
      var blob = new Blob([JSON.stringify(datos, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "libros_backup_" + new Date().toISOString().slice(0,10) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importarDatos(evento) {
      var archivo = evento.target.files[0];
      if (!archivo) return;

      var lector = new FileReader();
      lector.onload = function(e) {
        try {
          var datos = JSON.parse(e.target.result);
          
          if (typeof datos.paraLeer !== 'undefined' && typeof datos.leidos !== 'undefined') {
            if (confirm("¿Importar datos? Se sobrescribirán los datos actuales.")) {
              guardar(CLAVE_PARA_LEER, datos.paraLeer);
              guardar(CLAVE_LEIDOS, datos.leidos);
              renderParaLeer();
              renderLeidos();
              alert("Datos importados correctamente.");
            }
          } else {
            alert("El archivo no tiene el formato correcto.");
          }
        } catch (error) {
          alert("Error al leer el archivo: " + error.message);
        }
      };
      lector.readAsText(archivo);
      
      inputArchivo.value = "";
    }

    botonAnadir.addEventListener("click", anadirLibro);
    inputAutor.addEventListener("keydown", function (e) {
      if (e.key === "Enter") anadirLibro();
    });
    inputTitulo.addEventListener("keydown", function (e) {
      if (e.key === "Enter") inputAutor.focus();
    });
    tabParaLeer.addEventListener("click", mostrarParaLeer);
    tabLeidos.addEventListener("click", mostrarLeidos);
    ordenDirection.addEventListener("click", toggleDirection);
    ordenCampo.addEventListener("change", cambiarOrden);
    btnExportar.addEventListener("click", exportarDatos);
    btnImportar.addEventListener("click", function() {
      inputArchivo.click();
    });
    inputArchivo.addEventListener("change", importarDatos);

    renderParaLeer();
  </script>
</body>
</html>
