<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de libros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #f2ecdf;
      --fondo-tarjeta: #faf6ee;
      --texto: #3a352d;
      --texto-suave: #7a7264;
      --borde: #ddd3c0;
      --acento: #8a7a5c;
      --estrella: #d4a373;
      --estrella-vacia: #e8ddd0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--fondo);
      color: var(--texto);
      font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 960px;
      padding: 64px 24px 24px;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 2.6rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .volver {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--texto-suave);
      text-decoration: none;
      border-bottom: 1px solid var(--borde);
      padding-bottom: 1px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .volver:hover {
      color: var(--acento);
      border-bottom-color: var(--acento);
    }

    main {
      width: 100%;
      max-width: 960px;
      padding: 0 24px 64px;
    }

    .selector {
      display: flex;
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 6px;
      margin-bottom: 28px;
      gap: 6px;
      flex-wrap: wrap;
    }

    .selector button {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 7px;
      background-color: transparent;
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .selector button.activo {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
    }

    .selector button .badge {
      display: inline-block;
      background-color: var(--texto-suave);
      color: var(--fondo-tarjeta);
      font-size: 0.65rem;
      font-weight: 600;
      padding: 1px 8px;
      border-radius: 10px;
      margin-left: 6px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .selector button.activo .badge {
      background-color: var(--fondo-tarjeta);
      color: var(--acento);
    }

    .fila-entrada {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .fila-entrada input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .fila-entrada input:focus {
      border-color: var(--acento);
      box-shadow: 0 0 0 3px rgba(138, 122, 92, 0.15);
    }

    .fila-entrada input::placeholder {
      color: var(--texto-suave);
    }

    .boton-cuadrado {
      flex: none;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--acento);
      border-radius: 8px;
      background-color: transparent;
      color: var(--acento);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }

    .boton-cuadrado:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      transform: scale(1.02);
    }

    .boton-cuadrado:active {
      transform: scale(0.95);
    }

    .boton-cuadrado svg {
      width: 18px;
      height: 18px;
    }

    .libro {
      display: flex;
      flex-direction: column;
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 12px;
      transition: box-shadow 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    }

    .libro:hover {
      box-shadow: 0 4px 14px rgba(58, 53, 45, 0.08);
      transform: translateY(-2px);
      border-color: var(--acento);
    }

    .libro .fila-principal {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .libro .info {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 150px;
    }

    .libro .info .titulo {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .libro .info .autor {
      color: var(--texto-suave);
      font-size: 0.95rem;
    }

    .libro .fecha {
      font-size: 0.8rem;
      color: var(--texto-suave);
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .libro .fecha span {
      font-weight: 500;
      color: var(--texto);
    }

    .libro .fecha .boton-editar-fecha {
      background: none;
      border: 1px solid var(--borde);
      border-radius: 4px;
      padding: 2px 6px;
      color: var(--texto-suave);
      cursor: pointer;
      font-size: 0.7rem;
      line-height: 1;
      transition: all 0.2s ease;
      opacity: 0.5;
    }

    .libro .fecha .boton-editar-fecha:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
      opacity: 1;
    }

    .libro .fecha .editor-fecha {
      display: none;
      gap: 4px;
      align-items: center;
    }

    .libro .fecha .editor-fecha.visible {
      display: flex;
    }

    .libro .fecha .editor-fecha input[type="date"] {
      padding: 2px 6px;
      border: 1px solid var(--borde);
      border-radius: 4px;
      background-color: var(--fondo);
      color: var(--texto);
      font-family: inherit;
      font-size: 0.7rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s ease;
      max-width: 120px;
    }

    .libro .fecha .editor-fecha input[type="date"]:focus {
      border-color: var(--acento);
    }

    .libro .fecha .editor-fecha input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0.6;
      cursor: pointer;
    }

    .libro .fecha .editor-fecha input[type="date"]:hover::-webkit-calendar-picker-indicator {
      opacity: 1;
    }

    .libro .fecha .editor-fecha .boton-fecha-pequeno {
      padding: 2px 8px;
      border: 1px solid var(--borde);
      border-radius: 4px;
      background-color: var(--fondo);
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .libro .fecha .editor-fecha .boton-fecha-pequeno:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .libro .fecha .editor-fecha .boton-fecha-pequeno.activo {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .estrellas {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .estrella-btn {
      background: none;
      border: none;
      padding: 2px;
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      color: var(--estrella-vacia);
      transition: color 0.2s ease, transform 0.15s ease;
    }

    .estrella-btn:hover {
      transform: scale(1.15);
    }

    .estrella-btn.activa {
      color: var(--estrella);
    }

    .estrella-btn.activa:hover {
      color: #b8926a;
    }

    .libro .acciones {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .libro .acciones .fila-acciones {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .boton-eliminar {
      background: none;
      border: 1px solid var(--borde);
      border-radius: 4px;
      padding: 4px 6px;
      color: var(--texto-suave);
      cursor: pointer;
      font-size: 0.7rem;
      line-height: 1;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
    }

    .boton-eliminar:hover {
      background-color: #d32f2f;
      color: var(--fondo-tarjeta);
      border-color: #d32f2f;
      transform: scale(1.05);
    }

    .boton-eliminar svg {
      width: 14px;
      height: 14px;
    }

    .boton-nota {
      background: none;
      border: 1px solid var(--borde);
      border-radius: 4px;
      padding: 4px 6px;
      color: var(--texto-suave);
      cursor: pointer;
      font-size: 0.7rem;
      line-height: 1;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
    }

    .boton-nota:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
      transform: scale(1.05);
    }

    .boton-nota.abierto {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .boton-nota svg {
      width: 14px;
      height: 14px;
    }

    .boton-cita {
      background: none;
      border: 1px solid var(--borde);
      border-radius: 4px;
      padding: 4px 6px;
      color: var(--texto-suave);
      cursor: pointer;
      font-size: 0.7rem;
      line-height: 1;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
    }

    .boton-cita:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
      transform: scale(1.05);
    }

    .boton-cita.abierto {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .boton-cita svg {
      width: 14px;
      height: 14px;
    }

    .nota-area {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--borde);
      width: 100%;
      animation: fadeIn 0.3s ease;
    }

    .nota-area.visible {
      display: block;
    }

    .nota-area textarea {
      width: 100%;
      min-height: 80px;
      padding: 10px 12px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo);
      color: var(--texto);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      resize: vertical;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      line-height: 1.5;
    }

    .nota-area textarea:focus {
      border-color: var(--acento);
      box-shadow: 0 0 0 3px rgba(138, 122, 92, 0.1);
    }

    .nota-area textarea::placeholder {
      color: var(--texto-suave);
      opacity: 0.5;
    }

    /* Área de citas */
    .cita-area {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--borde);
      width: 100%;
      animation: fadeIn 0.3s ease;
    }

    .cita-area.visible {
      display: block;
    }

    .cita-area .cita-lista {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .cita-area .cita-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 12px;
      background-color: var(--fondo);
      border-radius: 6px;
      border-left: 3px solid var(--acento);
    }

    .cita-area .cita-item .cita-texto {
      flex: 1;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--texto);
      line-height: 1.5;
    }

    .cita-area .cita-item .cita-eliminar {
      background: none;
      border: none;
      color: var(--texto-suave);
      cursor: pointer;
      font-size: 1rem;
      padding: 0 4px;
      transition: color 0.2s ease;
      line-height: 1;
    }

    .cita-area .cita-item .cita-eliminar:hover {
      color: #d32f2f;
    }

    .cita-area .cita-input-area {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .cita-area .cita-input-area input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      background-color: var(--fondo);
      color: var(--texto);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s ease;
      font-style: italic;
    }

    .cita-area .cita-input-area input:focus {
      border-color: var(--acento);
    }

    .cita-area .cita-input-area input::placeholder {
      color: var(--texto-suave);
      opacity: 0.5;
      font-style: italic;
    }

    .cita-area .cita-input-area .boton-cita-guardar {
      flex: none;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--acento);
      border-radius: 6px;
      background-color: transparent;
      color: var(--acento);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cita-area .cita-input-area .boton-cita-guardar:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
    }

    .cita-area .cita-input-area .boton-cita-guardar svg {
      width: 16px;
      height: 16px;
    }

    .cita-area .sin-citas {
      color: var(--texto-suave);
      font-size: 0.8rem;
      font-style: italic;
      opacity: 0.6;
      padding: 4px 0;
    }

    /* Estadísticas */
    .estadisticas-container {
      margin-bottom: 24px;
    }

    .estadisticas-container .filtro-anos {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .estadisticas-container .filtro-anos button {
      padding: 4px 12px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      background-color: transparent;
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .estadisticas-container .filtro-anos button:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .estadisticas-container .filtro-anos button.activo {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .estadisticas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      padding: 16px;
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .estadisticas .stat {
      text-align: center;
    }

    .estadisticas .stat .numero {
      font-size: 1.8rem;
      font-weight: 600;
      font-family: "Cormorant Garamond", Georgia, serif;
      color: var(--acento);
    }

    .estadisticas .stat .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--texto-suave);
    }

    .grafico-mensual {
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    .grafico-mensual .grafico-titulo {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--texto-suave);
      margin-bottom: 12px;
      text-align: center;
    }

    .grafico-mensual .barras {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      height: 160px;
      gap: 6px;
      padding: 0 4px;
    }

    .grafico-mensual .barra-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      height: 100%;
      justify-content: flex-end;
    }

    .grafico-mensual .barra-item .barra {
      width: 100%;
      max-width: 30px;
      min-height: 4px;
      background-color: var(--acento);
      border-radius: 4px 4px 0 0;
      transition: height 0.6s ease;
      opacity: 0.7;
      position: relative;
    }

    .grafico-mensual .barra-item .barra:hover {
      opacity: 1;
    }

    .grafico-mensual .barra-item .barra .barra-valor {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--texto-suave);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .grafico-mensual .barra-item .barra:hover .barra-valor {
      opacity: 1;
    }

    .grafico-mensual .barra-item .mes-label {
      font-size: 0.6rem;
      color: var(--texto-suave);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .grafico-mensual .sin-datos {
      color: var(--texto-suave);
      font-size: 0.9rem;
      text-align: center;
      padding: 20px 0;
    }

    .grafico-lineas {
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .grafico-lineas .grafico-titulo {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--texto-suave);
      margin-bottom: 12px;
      text-align: center;
    }

    .grafico-lineas .grafico-svg {
      display: block;
      margin: 0 auto;
      max-width: 100%;
    }

    .grafico-lineas .linea-leyenda {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
    }

    .grafico-lineas .linea-leyenda .leyenda-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--texto-suave);
    }

    .grafico-lineas .linea-leyenda .leyenda-item .color-muestra {
      display: inline-block;
      width: 20px;
      height: 3px;
      border-radius: 2px;
    }

    .grafico-lineas .sin-datos {
      color: var(--texto-suave);
      font-size: 0.9rem;
      text-align: center;
      padding: 20px 0;
    }

    .lista-vacia {
      color: var(--texto-suave);
      font-size: 0.9rem;
      text-align: center;
      padding: 32px 0;
      border: 1px dashed var(--borde);
      border-radius: 10px;
    }

    .oculto {
      display: none;
    }

    .ordenacion {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .ordenacion label {
      font-size: 0.85rem;
      color: var(--texto-suave);
      margin-right: 4px;
    }

    .ordenacion select {
      padding: 6px 10px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .ordenacion select:focus {
      border-color: var(--acento);
      box-shadow: 0 0 0 3px rgba(138, 122, 92, 0.1);
    }

    .ordenacion button {
      padding: 6px 14px;
      border: 1px solid var(--borde);
      border-radius: 6px;
      background-color: var(--fondo-tarjeta);
      color: var(--texto-suave);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ordenacion button:hover {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .ordenacion button.activo {
      background-color: var(--acento);
      color: var(--fondo-tarjeta);
      border-color: var(--acento);
    }

    .busqueda {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .busqueda input {
      flex: 1;
      padding: 8px 14px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background-color: var(--fondo-tarjeta);

    .busqueda input:focus {
      border-color: var(--acento);
      box-shadow: 0 0 0 3px rgba(138, 122, 92, 0.1);
    }

    .busqueda input::placeholder {
      color: var(--texto-suave);

    }

    .respaldo {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--borde);
      flex-wrap: wrap;

    }

    .respaldo button {
      padding: 10px 20px;
      border: 1px solid var(--borde);

    .respaldo button:hover {

    .respaldo input[type="file"] {

    footer {
      margin-top: auto;
      padding: 24px;
      font-size: 0.8rem;
      color: var(--texto-suave);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      main {
        padding: 0 16px 40px;
      }

      header {
        padding: 40px 16px 16px;
      }

      .grafico-mensual .barras {
        height: 120px;
      }

      .grafico-mensual .barra-item .mes-label {
        font-size: 0.5rem;
      }

      .grafico-lineas .grafico-svg {
        width: 100%;
        height: auto;
      }
    }

    @media (max-width: 540px) {
      .fila-entrada {
        flex-wrap: wrap;
      }

      .fila-entrada input {
        flex: 1 1 100%;
      }

      .boton-cuadrado {
        width: 100%;
      }

      .libro .fila-principal {
        flex-direction: column;
        align-items: stretch;
      }

      .libro .info {
        min-width: unset;
      }

      .libro .acciones {
        align-items: stretch;
        padding-top: 4px;
        border-top: 1px solid var(--borde);
      }

      .libro .acciones .fila-acciones {
        justify-content: flex-start;
        flex-wrap: wrap;

      .libro .fecha {
        justify-content: flex-start;

      .libro .fecha .editor-fecha {

      }

      .libro .fecha .editor-fecha input[type="date"] {
        flex: 1;
        min-width: 100px;
        max-width: unset;
      }

      .ordenacion {
        flex-direction: column;
        align-items: stretch;
      }

      .ordenacion select {
        width: 100%;
      }

      .respaldo {
        flex-direction: column;
      }

      .respaldo button {
        width: 100%;
      }

      .estadisticas {
        grid-template-columns: repeat(2, 1fr);
      }

      .estadisticas-container .filtro-anos {
        justify-content: center;
      }

      .grafico-mensual .barras {
        height: 100px;
        gap: 4px;
      }

      .grafico-mensual .barra-item .barra {

      }

      .cita-area .cita-input-area input {

  </style>
</head>
<body>
  <header>
    <h1>Lista de libros</h1>
    <a class="volver" href="../">Volver al inicio</a>
  </header>

  <main>
    <div class="selector">
      <button id="tab-para-leer" class="activo" type="button">
        Para leer <span class="badge" id="badge-para-leer">0</span>
      </button>
      <button id="tab-leidos" type="button">
        Leídos <span class="badge" id="badge-leidos">0</span>
      </button>
      <button id="tab-estadisticas" type="button">Estadísticas</button>
    </div>

    <div id="vista-para-leer">
      <div class="fila-entrada">
        <input id="input-titulo" type="text" placeholder="Título" autocomplete="off">
        <input id="input-autor" type="text" placeholder="Autor" autocomplete="off">
        <button class="boton-cuadrado" id="boton-anadir" type="button" title="Añadir libro" aria-label="Añadir libro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>

        </button>
      </div>
      <div id="lista-para-leer"></div>
    </div>

    <div id="vista-leidos" class="oculto">
      <div class="ordenacion">
        <label for="orden-campo-leidos">Ordenar por:</label>
        <select id="orden-campo-leidos">
          <option value="fecha">Fecha</option>
          <option value="titulo">Título</option>
          <option value="autor">Autor</option>
          <option value="puntuacion">Puntuación</option>
        </select>
        <button id="orden-direction-leidos" type="button">Descendente ↓</button>
      </div>
      <div class="busqueda">
        <input id="busqueda-leidos" type="text" placeholder="Buscar libro o autor..." autocomplete="off">
      </div>
      <div id="lista-leidos"></div>
    </div>

    <div id="vista-estadisticas" class="oculto">
      <div id="estadisticas-container"></div>
    </div>

    <div class="respaldo">
      <button id="btn-exportar" type="button">Exportar datos</button>
      <button id="btn-importar" type="button">Importar datos</button>
      <input type="file" id="input-archivo" accept=".json">

  </main>

  <footer>
    <p>Web personal</p>
  </footer>

  <script>
    var CLAVE_PARA_LEER = "librosParaLeer";
    var CLAVE_LEIDOS = "librosLeidos";

    var inputTitulo = document.getElementById("input-titulo");
    var inputAutor = document.getElementById("input-autor");
    var botonAnadir = document.getElementById("boton-anadir");
    var listaParaLeer = document.getElementById("lista-para-leer");
    var listaLeidos = document.getElementById("lista-leidos");
    var estadisticasContainer = document.getElementById("estadisticas-container");
    var tabParaLeer = document.getElementById("tab-para-leer");
    var tabLeidos = document.getElementById("tab-leidos");
    var tabEstadisticas = document.getElementById("tab-estadisticas");
    var vistaParaLeer = document.getElementById("vista-para-leer");
    var vistaLeidos = document.getElementById("vista-leidos");
    var vistaEstadisticas = document.getElementById("vista-estadisticas");
    var btnExportar = document.getElementById("btn-exportar");
    var btnImportar = document.getElementById("btn-importar");
    var inputArchivo = document.getElementById("input-archivo");
    var ordenCampoLeidos = document.getElementById("orden-campo-leidos");
    var ordenDirectionLeidos = document.getElementById("orden-direction-leidos");
    var busquedaLeidos = document.getElementById("busqueda-leidos");

    var direccionAscendenteLeidos = false;
    var filtroAno = 'todos';

    function cargar(clave) {
      try {
        return JSON.parse(localStorage.getItem(clave)) || [];
      } catch (e) {
        return [];
      }
    }

    function guardar(clave, datos) {
      localStorage.setItem(clave, JSON.stringify(datos));
    }

    function obtenerFechaActual() {
      var hoy = new Date();
      var dd = String(hoy.getDate()).padStart(2, '0');
      var mm = String(hoy.getMonth() + 1).padStart(2, '0');
      var yyyy = hoy.getFullYear();
      return yyyy + '-' + mm + '-' + dd;
    }

    function formatearFecha(fecha) {
      if (!fecha) return '';
      var partes = fecha.split('-');
      if (partes.length === 3) {
        return partes[2] + '/' + partes[1] + '/' + partes[0];
      }
      return fecha;
    }

    function obtenerAnio(fecha) {
      if (!fecha) return null;
      var partes = fecha.split('-');
      if (partes.length === 3) {
        return parseInt(partes[0]);
      }
      return null;
    }

    function obtenerMes(fecha) {
      if (!fecha) return null;
      var partes = fecha.split('-');
      if (partes.length === 3) {
        return parseInt(partes[1]);
      }
      return null;
    }

    function actualizarBadges() {
      var paraLeer = cargar(CLAVE_PARA_LEER);
      var leidos = cargar(CLAVE_LEIDOS);
      document.getElementById('badge-para-leer').textContent = paraLeer.length;
      document.getElementById('badge-leidos').textContent = leidos.length;
    }

    function svgTick() {
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "2");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      var path = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      path.setAttribute("points", "20 6 9 17 4 12");
      svg.appendChild(path);
      return svg;
    }

    function svgCalendar() {
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");

      svg.setAttribute("stroke-width", "2");

      line1.setAttribute("y2", "6");

      line2.setAttribute("x2", "8");
      line2.setAttribute("y2", "6");

      line3.setAttribute("x1", "3");

      line3.setAttribute("x2", "21");

    function svgNote() {
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "2");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      
      var path1 = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path1.setAttribute("d", "M12 20h9");
      svg.appendChild(path1);
      
      var path2 = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path2.setAttribute("d", "M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z");
      svg.appendChild(path2);
      
      return svg;
    }

    function svgQuote() {
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "2");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      
      var path1 = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path1.setAttribute("d", "M10 11h-4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1z");
      svg.appendChild(path1);
      
      var path2 = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path2.setAttribute("d", "M19 11h-4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1z");
      svg.appendChild(path2);
      
      var line1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line1.setAttribute("x1", "5");
      line1.setAttribute("y1", "15");
      line1.setAttribute("x2", "19");
      line1.setAttribute("y2", "15");
      svg.appendChild(line1);
      
      var line2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line2.setAttribute("x1", "5");
      line2.setAttribute("y1", "18");
      line2.setAttribute("x2", "19");
      line2.setAttribute("y2", "18");
      svg.appendChild(line2);
      
      return svg;
    }

    function svgClose() {
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "2");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      
      var line1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line1.setAttribute("x1", "18");
      line1.setAttribute("y1", "6");
      line1.setAttribute("x2", "6");
      line1.setAttribute("y2", "18");
      svg.appendChild(line1);
      
      var line2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line2.setAttribute("x1", "6");
      line2.setAttribute("y1", "6");
      line2.setAttribute("x2", "18");
      line2.setAttribute("y2", "18");
      svg.appendChild(line2);
      
      return svg;
    }

    function svgPlus() {
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "2");
      svg.setAttribute("stroke-linecap", "round");
      
      var line1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line1.setAttribute("x1", "12");
      line1.setAttribute("y1", "5");
      line1.setAttribute("x2", "12");
      line1.setAttribute("y2", "19");
      svg.appendChild(line1);
      
      var line2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line2.setAttribute("x1", "5");
      line2.setAttribute("y1", "12");
      line2.setAttribute("x2", "19");
      line2.setAttribute("y2", "12");
      svg.appendChild(line2);
      
      return svg;
    }

    function crearInfoLibro(libro) {
      var div = document.createElement("div");
      div.className = "info";

      var titulo = document.createElement("div");
      titulo.className = "titulo";
      titulo.textContent = libro.titulo || "Sin título";
      div.appendChild(titulo);

      var autor = document.createElement("div");
      autor.className = "autor";
      autor.textContent = libro.autor || "Autor desconocido";
      div.appendChild(autor);

      return div;
    }

    function mensajeVacio(texto) {
      var div = document.createElement("div");
      div.className = "lista-vacia";
      div.textContent = texto;
      return div;
    }

    function crearEstrellas(libro, indice) {
      var contenedor = document.createElement("div");
      contenedor.className = "estrellas";

      if (typeof libro.puntuacion === 'undefined') {
        libro.puntuacion = 0;
      }

      for (var i = 1; i <= 5; i++) {
        var btn = document.createElement("button");
        btn.className = "estrella-btn" + (i <= libro.puntuacion ? " activa" : "");
        btn.textContent = "★";
        btn.type = "button";
        btn.setAttribute("aria-label", "Puntuación " + i + " estrellas");
        
        btn.addEventListener("click", function(estrellaIndex) {
          return function() {
            actualizarPuntuacion(indice, estrellaIndex);
          };
        }(i));

        contenedor.appendChild(btn);
      }

      return contenedor;
    }

    function crearFechaLeido(libro, indice) {
      var contenedor = document.createElement("div");
      contenedor.className = "fecha";

      var textoFecha = document.createElement("span");
      if (libro.fecha) {
        textoFecha.textContent = formatearFecha(libro.fecha);
      } else {
        textoFecha.textContent = "Sin fecha";
        textoFecha.style.color = "var(--texto-suave)";
      }
      contenedor.appendChild(textoFecha);

      var botonEditar = document.createElement("button");
      botonEditar.className = "boton-editar-fecha";
      botonEditar.type = "button";
      botonEditar.title = "Editar fecha";
      botonEditar.setAttribute("aria-label", "Editar fecha");
      botonEditar.appendChild(svgCalendar());
      contenedor.appendChild(botonEditar);

      var editor = document.createElement("div");
      editor.className = "editor-fecha";

      var input = document.createElement("input");
      input.type = "date";
      input.value = libro.fecha || '';
      input.setAttribute("aria-label", "Fecha de finalización");
      
      var botonHoy = document.createElement("button");
      botonHoy.className = "boton-fecha-pequeno";
      botonHoy.textContent = "Hoy";
      botonHoy.type = "button";
      
      if (libro.fecha === obtenerFechaActual()) {
        botonHoy.classList.add("activo");
      }
      
      var botonGuardar = document.createElement("button");
      botonGuardar.className = "boton-fecha-pequeno";
      botonGuardar.textContent = "Guardar";
      botonGuardar.type = "button";

      var botonCancelar = document.createElement("button");
      botonCancelar.className = "boton-fecha-pequeno";
      botonCancelar.textContent = "×";
      botonCancelar.type = "button";
      botonCancelar.setAttribute("aria-label", "Cancelar");

      editor.appendChild(input);
      editor.appendChild(botonHoy);
      editor.appendChild(botonGuardar);
      editor.appendChild(botonCancelar);

      contenedor.appendChild(editor);

      function mostrarEditor() {
        contenedor.querySelector('.editor-fecha').classList.add('visible');
        input.focus();
      }

      function ocultarEditor() {
        contenedor.querySelector('.editor-fecha').classList.remove('visible');
      }

      function guardarFecha() {
        var fecha = input.value;
        actualizarFecha(indice, fecha);
        if (fecha === obtenerFechaActual()) {
          botonHoy.classList.add("activo");
        } else {
          botonHoy.classList.remove("activo");
        }
        ocultarEditor();
        var span = contenedor.querySelector('span');
        if (fecha) {
          span.textContent = formatearFecha(fecha);
          span.style.color = "";
        } else {
          span.textContent = "Sin fecha";
          span.style.color = "var(--texto-suave)";
        }
      }

      botonEditar.addEventListener("click", function(e) {
        e.stopPropagation();
        if (editor.classList.contains('visible')) {
          ocultarEditor();
        } else {
          mostrarEditor();
        }
      });

      botonGuardar.addEventListener("click", function(e) {
        e.stopPropagation();
        guardarFecha();
      });

      botonCancelar.addEventListener("click", function(e) {
        e.stopPropagation();
        ocultarEditor();
      });

      botonHoy.addEventListener("click", function(e) {
        e.stopPropagation();
        var fechaHoy = obtenerFechaActual();
        input.value = fechaHoy;
        this.classList.add("activo");
      });

      input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          guardarFecha();
        }
        if (e.key === "Escape") {
          ocultarEditor();
        }
      });

      document.addEventListener("click", function(e) {
        if (!contenedor.contains(e.target)) {
          ocultarEditor();
        }
      });

      return contenedor;
    }

    function crearNota(libro, indice) {
      var contenedor = document.createElement("div");
      contenedor.className = "nota-area";
      
      var textarea = document.createElement("textarea");
      textarea.value = libro.nota || '';
      textarea.placeholder = "Escribe aquí tus anotaciones...";
      textarea.setAttribute("data-indice", indice);
      
      textarea.addEventListener("input", function() {
        var idx = parseInt(this.getAttribute("data-indice"));
        var lista = cargar(CLAVE_PARA_LEER);
        if (lista[idx]) {
          lista[idx].nota = this.value;
          guardar(CLAVE_PARA_LEER, lista);
        }
      });

      contenedor.appendChild(textarea);
      return contenedor;
    }

    // ===== FUNCIONES PARA CITAS =====
    function crearCitasParaLeer(libro, indice) {
      var contenedor = document.createElement("div");
      contenedor.className = "cita-area";
      
      // Lista de citas
      var lista = document.createElement("div");
      lista.className = "cita-lista";
      
      var citas = libro.citas || [];
      if (citas.length === 0) {
        var sinCitas = document.createElement("div");
        sinCitas.className = "sin-citas";
        sinCitas.textContent = "No hay citas aún. Escribe una abajo.";
        lista.appendChild(sinCitas);
      } else {
        citas.forEach(function(cita, citaIdx) {
          var item = document.createElement("div");
          item.className = "cita-item";
          
          var texto = document.createElement("span");
          texto.className = "cita-texto";
          texto.textContent = '"' + cita + '"';
          item.appendChild(texto);
          
          var eliminar = document.createElement("button");
          eliminar.className = "cita-eliminar";
          eliminar.textContent = "×";
          eliminar.setAttribute("data-cita-indice", citaIdx);
          eliminar.addEventListener("click", function(e) {
            e.stopPropagation();
            eliminarCitaParaLeer(indice, citaIdx);
          });
          item.appendChild(eliminar);
          
          lista.appendChild(item);
        });
      }
      
      contenedor.appendChild(lista);
      
      // Input para añadir nueva cita
      var inputArea = document.createElement("div");
      inputArea.className = "cita-input-area";
      
      var input = document.createElement("input");
      input.type = "text";
      input.placeholder = "Escribe una cita y presiona Enter o el tick...";
      input.setAttribute("data-indice", indice);
      
      var botonGuardar = document.createElement("button");
      botonGuardar.className = "boton-cita-guardar";

    function ordenarLibros(libros, campo, ascendente) {
      var copia = libros.slice();
      
      copia.sort(function(a, b) {
        var valorA, valorB;
        
        if (campo === 'fecha') {
          valorA = a.fecha || '';
          valorB = b.fecha || '';
          if (valorA === '' && valorB === '') return 0;
          if (valorA === '') return 1;
          if (valorB === '') return -1;
        } else if (campo === 'titulo') {
          valorA = (a.titulo || '').toLowerCase();
          valorB = (b.titulo || '').toLowerCase();
        } else if (campo === 'autor') {
          valorA = (a.autor || '').toLowerCase();
          valorB = (b.autor || '').toLowerCase();
        } else if (campo === 'puntuacion') {
          valorA = a.puntuacion || 0;
          valorB = b.puntuacion || 0;
        }
        
        if (valorA < valorB) return ascendente ? -1 : 1;
        if (valorA > valorB) return ascendente ? 1 : -1;
        return 0;
      });
      
      return copia;
    }

    function filtrarLibrosPorBusqueda(libros, texto) {
      if (!texto || texto.trim() === '') return libros;
      var termino = texto.toLowerCase().trim();
      return libros.filter(function(libro) {
        var titulo = (libro.titulo || '').toLowerCase();
        var autor = (libro.autor || '').toLowerCase();
        return titulo.includes(termino) || autor.includes(termino);
      });
    }

    // ===== GRÁFICO MENSUAL (BARRAS) =====
    function renderGraficoMensual(libros, año) {
      var meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
      var librosPorMes = Array(12).fill(0);
      
      libros.forEach(function(libro) {
        var anio = obtenerAnio(libro.fecha);
        var mes = obtenerMes(libro.fecha);
        if (anio === año && mes !== null && mes >= 1 && mes <= 12) {
          librosPorMes[mes - 1]++;
        }
      });
      
      var max = Math.max(1, Math.max.apply(null, librosPorMes));
      
      var html = '<div class="grafico-mensual">';
      html += '<div class="grafico-titulo">Libros leídos por mes - ' + año + '</div>';
      html += '<div class="barras">';
      
      for (var i = 0; i < 12; i++) {
        var altura = Math.max(4, (librosPorMes[i] / max) * 140);
        var valor = librosPorMes[i];
        html += '<div class="barra-item">';
        html += '<div class="barra" style="height:' + altura + 'px;">';
        if (valor > 0) {
          html += '<span class="barra-valor">' + valor + '</span>';
        }
        html += '</div>';
        html += '<span class="mes-label">' + meses[i] + '</span>';
        html += '</div>';
      }
      
      html += '</div>';
      html += '</div>';
      
      return html;
    }

    // ===== GRÁFICO DE LÍNEAS (COMPARAR AÑOS) =====
    function renderGraficoLineas(leidos) {
      var meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
      
      var anos = obtenerAniosDisponibles(leidos);
      if (anos.length === 0) return '';
      
      var datosAnos = {};
      anos.forEach(function(ano) {
        var librosPorMes = Array(12).fill(0);
        leidos.forEach(function(libro) {
          var anio = obtenerAnio(libro.fecha);
          var mes = obtenerMes(libro.fecha);
          if (anio === ano && mes !== null && mes >= 1 && mes <= 12) {
            librosPorMes[mes - 1]++;
          }
        });
        datosAnos[ano] = librosPorMes;
      });
      
      var maxValor = 1;
      for (var ano in datosAnos) {
        var maxAno = Math.max.apply(null, datosAnos[ano]);
        if (maxAno > maxValor) maxValor = maxAno;
      }
      
      var colores = ['#8a7a5c', '#b8926a', '#6a8a7a', '#8a6a8a', '#6a7a8a', '#7a8a6a'];
      
      var ancho = 700;
      var alto = 200;
      var padding = { top: 20, bottom: 30, left: 30, right: 20 };
      var graficoAncho = ancho - padding.left - padding.right;
      var graficoAlto = alto - padding.top - padding.bottom;
      
      var puntos = 12;
      var pasoX = graficoAncho / (puntos - 1);
      
      var svg = '<svg class="grafico-svg" viewBox="0 0 ' + ancho + ' ' + alto + '" xmlns="http://www.w3.org/2000/svg">';
      
      svg += '<g transform="translate(' + padding.left + ',' + (alto - padding.bottom) + ')">';
      svg += '<line x1="0" y1="0" x2="' + graficoAncho + '" y2="0" stroke="var(--borde)" stroke-width="1"/>';
      for (var i = 0; i < puntos; i++) {
        var x = i * pasoX;
        svg += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="4" stroke="var(--borde)" stroke-width="1"/>';
        svg += '<text x="' + x + '" y="18" text-anchor="middle" font-size="10" fill="var(--texto-suave)">' + meses[i] + '</text>';
      }
      svg += '</g>';
      
      svg += '<g transform="translate(' + padding.left + ',' + padding.top + ')">';
      var numLineas = Math.min(5, maxValor);
      if (numLineas < 1) numLineas = 1;
      for (var i = 0; i <= numLineas; i++) {
        var y = graficoAlto - (i / numLineas) * graficoAlto;
        var valor = Math.round((i / numLineas) * maxValor);
        svg += '<line x1="0" y1="' + y + '" x2="' + graficoAncho + '" y2="' + y + '" stroke="var(--borde)" stroke-width="0.5" stroke-dasharray="3,3"/>';
        svg += '<text x="-6" y="' + (y + 4) + '" text-anchor="end" font-size="9" fill="var(--texto-suave)">' + valor + '</text>';
      }
      svg += '</g>';
      
      var indexAno = 0;
      for (var ano in datosAnos) {
        var color = colores[indexAno % colores.length];
        var datos = datosAnos[ano];
        
        var pathD = '';
        var puntosPath = [];
        var primerPunto = true;
        for (var i = 0; i < datos.length; i++) {
          var x = padding.left + i * pasoX;
          var y = padding.top + graficoAlto - (datos[i] / maxValor) * graficoAlto;
          if (primerPunto) {
            pathD += 'M ' + x + ' ' + y;
            primerPunto = false;
          } else {
            pathD += ' L ' + x + ' ' + y;
          }
          puntosPath.push({ x: x, y: y, valor: datos[i] });
        }
        
        svg += '<polyline points="' + pathD.replace(/[ML]/g, '').trim() + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>';
        
        for (var i = 0; i < puntosPath.length; i++) {
          var p = puntosPath[i];
          if (p.valor > 0) {
            svg += '<circle cx="' + p.x + '" cy="' + p.y + '" r="3.5" fill="' + color + '" opacity="0.9"/>';
          }
        }
        
        indexAno++;
      }
      
      svg += '</svg>';
      
      var leyenda = '<div class="linea-leyenda">';
      var idx = 0;
      for (var ano in datosAnos) {
        var color = colores[idx % colores.length];
        leyenda += '<span class="leyenda-item">';
        leyenda += '<span class="color-muestra" style="background-color:' + color + ';"></span>';
        leyenda += ano;
        leyenda += '</span>';
        idx++;
      }
      leyenda += '</div>';
      
      var html = '<div class="grafico-lineas">';
      html += '<div class="grafico-titulo">Comparativa anual por meses</div>';
      html += svg;
      html += leyenda;
      html += '</div>';
      
      return html;
    }

    function renderEstadisticas() {
      var leidos = cargar(CLAVE_LEIDOS);
      
      var librosFiltrados = leidos;
      if (filtroAno !== 'todos') {
        librosFiltrados = leidos.filter(function(libro) {
          var anio = obtenerAnio(libro.fecha);
          return anio === filtroAno;
        });
      }
      
      var total = librosFiltrados.length;
      var mediaEstrellas = 0;
      var librosConPuntuacion = 0;
      var citas = [];

      librosFiltrados.forEach(function(libro) {
        if (typeof libro.puntuacion !== 'undefined' && libro.puntuacion > 0) {
          librosConPuntuacion++;
          mediaEstrellas += libro.puntuacion;
        }
        if (libro.citas && libro.citas.length > 0) {
          libro.citas.forEach(function(cita) {
            citas.push({ titulo: libro.titulo, autor: libro.autor, cita: cita });
          });
        }
      });

      if (librosConPuntuacion > 0) {
        mediaEstrellas = (mediaEstrellas / librosConPuntuacion).toFixed(1);
      }

      var html = '<div class="estadisticas-container">';
      
      var anos = obtenerAniosDisponibles(leidos);
      html += '<div class="filtro-anos">';
      html += '<button class="' + (filtroAno === 'todos' ? 'activo' : '') + '" data-ano="todos">Todos</button>';
      anos.forEach(function(ano) {
        html += '<button class="' + (filtroAno === ano ? 'activo' : '') + '" data-ano="' + ano + '">' + ano + '</button>';
      });
      html += '</div>';
      
      html += '<div class="estadisticas">';
      html += '<div class="stat"><div class="numero">' + total + '</div><div class="label">Libros leídos</div></div>';
      html += '<div class="stat"><div class="numero">' + mediaEstrellas + ' ★</div><div class="label">Media estrellas</div></div>';
      html += '</div>';

      if (filtroAno !== 'todos' && total > 0) {
        html += renderGraficoMensual(librosFiltrados, filtroAno);
      } else if (filtroAno === 'todos') {
        var graficoLineas = renderGraficoLineas(leidos);
        if (graficoLineas) {
          html += graficoLineas;
        }
      }

      if (citas.length > 0) {
        html += '<div class="seccion-titulo" style="margin-top:16px;">Citas destacadas</div>';
        citas.forEach(function(cita) {
          html += '<div class="libro" style="flex-direction:column;align-items:flex-start;padding:12px 16px;">';
          html += '<div style="font-style:italic;font-size:0.9rem;color:var(--texto);margin-bottom:4px;">" ' + cita.cita + ' "</div>';
          html += '<div style="font-size:0.8rem;color:var(--texto-suave);">— ' + cita.titulo + ', ' + cita.autor + '</div>';
          html += '</div>';
        });
      } else {
        html += '<div class="lista-vacia">Aún no hay citas destacadas. Añade citas a tus libros.</div>';
      }

      html += '</div>';
      estadisticasContainer.innerHTML = html;

      document.querySelectorAll('.filtro-anos button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          filtroAno = this.getAttribute('data-ano');
          if (filtroAno === 'todos') {
            filtroAno = 'todos';
          } else {
            filtroAno = parseInt(filtroAno);
          }
          renderEstadisticas();
        });
      });
    }

    function obtenerAniosDisponibles(leidos) {
      var anos = new Set();
      leidos.forEach(function(libro) {
        var anio = obtenerAnio(libro.fecha);
        if (anio !== null) {
          anos.add(anio);
        }
      });
      return Array.from(anos).sort(function(a, b) { return b - a; });
    }

    function anadirLibro() {
      var titulo = inputTitulo.value.trim();
      var autor = inputAutor.value.trim();
      if (!titulo) {
        inputTitulo.focus();
        return;
      }
      var libros = cargar(CLAVE_PARA_LEER);
      libros.unshift({ titulo: titulo, autor: autor, citas: [] });
      guardar(CLAVE_PARA_LEER, libros);
      inputTitulo.value = "";
      inputAutor.value = "";
      inputTitulo.focus();
      renderParaLeer();
      actualizarBadges();
    }

    function marcarLeido(indice) {
      var paraLeer = cargar(CLAVE_PARA_LEER);
      var leidos = cargar(CLAVE_LEIDOS);
      var libro = paraLeer.splice(indice, 1)[0];
      libro.puntuacion = 0;
      libro.fecha = obtenerFechaActual();
      if (!libro.citas) libro.citas = [];
      // Si había una cita antigua en el campo 'cita', la migramos
      if (libro.cita && libro.cita.trim()) {
        if (!libro.citas) libro.citas = [];
        libro.citas.push(libro.cita);
        libro.cita = '';
      }
      leidos.unshift(libro);
      guardar(CLAVE_PARA_LEER, paraLeer);
      guardar(CLAVE_LEIDOS, leidos);
      renderParaLeer();
      renderLeidos();
      renderEstadisticas();
      actualizarBadges();
    }

    function mostrarParaLeer() {
      tabParaLeer.classList.add("activo");
      tabLeidos.classList.remove("activo");
      tabEstadisticas.classList.remove("activo");
      vistaParaLeer.classList.remove("oculto");
      vistaLeidos.classList.add("oculto");
      vistaEstadisticas.classList.add("oculto");
    }

    function mostrarLeidos() {
      tabLeidos.classList.add("activo");
      tabParaLeer.classList.remove("activo");
      tabEstadisticas.classList.remove("activo");
      vistaLeidos.classList.remove("oculto");
      vistaParaLeer.classList.add("oculto");
      vistaEstadisticas.classList.add("oculto");
      renderLeidos();
    }

    function mostrarEstadisticas() {
      tabEstadisticas.classList.add("activo");
      tabParaLeer.classList.remove("activo");
      tabLeidos.classList.remove("activo");
      vistaEstadisticas.classList.remove("oculto");
      vistaParaLeer.classList.add("oculto");
      vistaLeidos.classList.add("oculto");
      renderEstadisticas();
    }

    function toggleDirectionLeidos() {
      direccionAscendenteLeidos = !direccionAscendenteLeidos;
      ordenDirectionLeidos.textContent = direccionAscendenteLeidos ? "Ascendente ↑" : "Descendente ↓";
      renderLeidos();
    }

    function cambiarOrdenLeidos() {
      renderLeidos();
    }

    function exportarDatos() {
      var datos = {
        paraLeer: cargar(CLAVE_PARA_LEER),
        leidos: cargar(CLAVE_LEIDOS),
        fecha: new Date().toISOString()
      };
      
      var blob = new Blob([JSON.stringify(datos, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "libros_backup_" + new Date().toISOString().slice(0,10) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importarDatos(evento) {
      var archivo = evento.target.files[0];
      if (!archivo) return;

      var lector = new FileReader();
      lector.onload = function(e) {
        try {
          var datos = JSON.parse(e.target.result);
          
          if (typeof datos.paraLeer !== 'undefined' && typeof datos.leidos !== 'undefined') {
            if (confirm("¿Importar datos? Se sobrescribirán los datos actuales.")) {
              // Asegurar que los libros tengan el campo citas
              if (datos.paraLeer) {
                datos.paraLeer.forEach(function(libro) {
                  if (!libro.citas) libro.citas = [];
                });
              }
              if (datos.leidos) {
                datos.leidos.forEach(function(libro) {
                  if (!libro.citas) libro.citas = [];
                });
              }
              guardar(CLAVE_PARA_LEER, datos.paraLeer);
              guardar(CLAVE_LEIDOS, datos.leidos);
              renderParaLeer();
              renderLeidos();
              renderEstadisticas();
              actualizarBadges();
              alert("Datos importados correctamente.");
            }
          } else {
            alert("El archivo no tiene el formato correcto.");
          }
        } catch (error) {
          alert("Error al leer el archivo: " + error.message);
        }
      };
      lector.readAsText(archivo);
      
      inputArchivo.value = "";
    }

    botonAnadir.addEventListener("click", anadirLibro);
    inputAutor.addEventListener("keydown", function (e) {
      if (e.key === "Enter") anadirLibro();
    });
    inputTitulo.addEventListener("keydown", function (e) {
      if (e.key === "Enter") inputAutor.focus();
    });
    tabParaLeer.addEventListener("click", mostrarParaLeer);
    tabLeidos.addEventListener("click", mostrarLeidos);
    tabEstadisticas.addEventListener("click", mostrarEstadisticas);
    ordenDirectionLeidos.addEventListener("click", toggleDirectionLeidos);
    ordenCampoLeidos.addEventListener("change", cambiarOrdenLeidos);
    busquedaLeidos.addEventListener("input", renderLeidos);
    btnExportar.addEventListener("click", exportarDatos);
    btnImportar.addEventListener("click", function() {
      inputArchivo.click();
    });
    inputArchivo.addEventListener("change", importarDatos);

    renderParaLeer();
    renderLeidos();
    renderEstadisticas();
    actualizarBadges();
  </script>
</body>
</html>
